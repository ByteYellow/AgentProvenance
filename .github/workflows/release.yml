name: Portable release

on:
  push:
    branches: ['release/v*']
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/build-release.py'
      - 'scripts/accept_release.py'
      - 'scripts/release_plan.py'
      - 'scripts/render_release_notes.py'
      - 'scripts/test_release_plan.py'
      - 'scripts/check_localized_docs.py'
      - 'docs/**'
      - 'assets.go'
      - 'README*'
      - 'CHANGELOG*'
      - 'scripts/accept_static_demo.*'
      - 'scripts/test_static_reader.cjs'
      - 'internal/**'
      - 'cmd/**'
      - 'demo/**'
      - 'go.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
      notes: ${{ steps.plan.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check release routing
        run: python3 -m unittest discover -s scripts -p test_release_plan.py -v
      - name: Resolve release intent and notes
        id: plan
        run: python3 scripts/release_plan.py
      - name: Check Chinese documentation and links
        run: python3 scripts/check_localized_docs.py
      - name: Validate source and all signed fixtures
        run: |
          test -z "$(gofmt -l internal cmd assets.go demo/assets.go docs/assets.go)"
          go vet ./...
          go test -race ./...

  build:
    needs: validate
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, os: linux, arch: amd64}
          - {runner: ubuntu-24.04-arm, os: linux, arch: arm64}
          - {runner: macos-15-intel, os: darwin, arch: amd64}
          - {runner: macos-15, os: darwin, arch: arm64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build portable archive
        run: python3 scripts/build-release.py --version "$RELEASE_VERSION" --os '${{ matrix.os }}' --arch '${{ matrix.arch }}'
      - name: Test downloaded experience without Go on PATH
        run: python3 scripts/accept_release.py dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  site:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser acceptance dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build the public replay reader
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: go build -ldflags "-X github.com/byteyellow/agentprovenance/internal/buildinfo.Version=$RELEASE_VERSION -X github.com/byteyellow/agentprovenance/internal/buildinfo.Commit=$GITHUB_SHA" -o /tmp/agentprov-site ./cmd/agentprov
      - name: Compare static replay with the local dashboard
        run: python3 scripts/accept_static_demo.py --binary /tmp/agentprov-site --site _site/AgentProvenance
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site/AgentProvenance

  publish:
    needs: [validate, build, site]
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Check Pages is ready for the paired release
        if: ${{ !contains(needs.validate.outputs.version, '-') }}
        uses: actions/configure-pages@v5
      - name: Validate checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_NOTES: ${{ needs.validate.outputs.notes }}
        shell: bash
        run: |
          version="$RELEASE_VERSION"
          cat dist/*.sha256 > dist/SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS)
          test "$(find dist -name '*.tar.gz' | wc -l)" -eq 4
          notes="$RELEASE_NOTES"
          test -f "$notes"
          python3 scripts/render_release_notes.py "$notes" \
            --repository "$GITHUB_REPOSITORY" --version "$version" > "$RUNNER_TEMP/release-notes.md"
          if gh release view "$version" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite published assets.' >&2
            exit 1
          fi
          prerelease=()
          if [[ "$version" == *-* ]]; then prerelease=(--prerelease --latest=false); fi
          gh release create "$version" dist/* --target "$GITHUB_SHA" \
            --title "$version" --notes-file "$RUNNER_TEMP/release-notes.md" "${prerelease[@]}"

  deploy-site:
    needs: [validate, site, publish]
    if: needs.validate.outputs.publish == 'true' && !contains(needs.validate.outputs.version, '-')
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
