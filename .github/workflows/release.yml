name: Portable release

on:
  push:
    branches: ['release/v*']
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/build-release.py'
      - 'scripts/accept_release.py'
      - 'internal/**'
      - 'cmd/**'
      - 'demo/**'
      - 'go.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - name: Validate source and all signed fixtures
        run: |
          test -z "$(gofmt -l internal cmd demo/assets.go)"
          go vet ./...
          go test -race ./...

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, os: linux, arch: amd64}
          - {runner: ubuntu-24.04-arm, os: linux, arch: arm64}
          - {runner: macos-15-intel, os: darwin, arch: amd64}
          - {runner: macos-15, os: darwin, arch: arm64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#release/}"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then version=v0.0.0-test; fi
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo 'Run a release from a vX.Y.Z tag or release/vX.Y.Z branch.' >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Build portable archive
        run: python3 scripts/build-release.py --version "$RELEASE_VERSION" --os '${{ matrix.os }}' --arch '${{ matrix.arch }}'
      - name: Test downloaded experience without Go on PATH
        run: python3 scripts/accept_release.py dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Validate checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#release/}"
          cat dist/*.sha256 > dist/SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS)
          test "$(find dist -name '*.tar.gz' | wc -l)" -eq 4
          notes="docs/releases/$version.md"
          test -f "$notes"
          if gh release view "$version" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite published assets.' >&2
            exit 1
          fi
          prerelease=()
          if [[ "$version" == *-* ]]; then prerelease=(--prerelease --latest=false); fi
          gh release create "$version" dist/* --target "$GITHUB_SHA" \
            --title "$version" --notes-file "$notes" "${prerelease[@]}"
