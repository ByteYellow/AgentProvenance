name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true

      - name: gofmt (fail on unformatted files)
        run: |
          unformatted="$(gofmt -l internal cmd)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needs to be run on:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: GOTOOLCHAIN=local go vet ./...

      - name: Run unit tests (race detector)
        run: GOTOOLCHAIN=local go test -race ./...

  sensor-build:
    name: eBPF sensor builds from committed bindings
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true

      # Architecture-specific bpf2go bindings (.go/.o) are committed, so this builds
      # the Linux sensor without clang/bpftool: the reproducible-build guarantee.
      - name: Build agentprov-sensor from committed bindings
        run: GOTOOLCHAIN=local go build -o /dev/null ./cmd/agentprov-sensor

  sensor-bindings-drift:
    name: eBPF sensor bindings drift check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true

      - name: Install eBPF compile toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev linux-tools-common linux-tools-generic
          sudo apt-get install -y "linux-tools-$(uname -r)" "linux-cloud-tools-$(uname -r)" || true
          sudo apt-get install -y linux-tools-azure linux-cloud-tools-azure || true

      - name: Regenerate and fail on drift of committed .go bindings
        run: GOTOOLCHAIN=local scripts/regen-sensor.sh --check

  sensor-live-amd64:
    name: amd64 syscalls and TLS on a live kernel
    runs-on: ubuntu-24.04
    needs: sensor-build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - name: Install local TLS fixture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libssl-dev openssl python3
      - name: Build sensor and fixture clients
        run: |
          mkdir -p /tmp/agentprov-live
          CGO_ENABLED=0 go build -o /tmp/agentprov-live/sensor ./cmd/agentprov-sensor
          CGO_ENABLED=0 go build -o /tmp/agentprov-live/go-client ./internal/sensor/testdata/tls_client.go
          gcc -O2 internal/sensor/testdata/tls_client.c -lssl -lcrypto -o /tmp/agentprov-live/c-client
      - name: Verify amd64 syscall, C ABI, Go ABI and queued event timestamps
        run: |
          sudo python3 scripts/accept_sensor_live.py \
            --sensor /tmp/agentprov-live/sensor \
            --go-client /tmp/agentprov-live/go-client \
            --c-client /tmp/agentprov-live/c-client \
            --ssl-lib /usr/lib/x86_64-linux-gnu/libssl.so.3 \
            --pause-drain 1.5 --report /tmp/agentprov-live/acceptance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amd64-live-evidence
          path: /tmp/agentprov-live/acceptance.*

  phase1-acceptance:
    name: Phase 1 observability smoke
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true

      - name: Run Phase 1 observability/provenance gate
        run: GOTOOLCHAIN=local ./scripts/accept_phase1.sh
