openapi: 3.1.0
info:
  title: AgentProvenance saved capture manifest API
  version: '1.0'
  description: >
    Read source-qualified observations saved with one Run. This query never
    substitutes current host health or a current capability catalog. Historical
    observations and checkpoint revisions remain separate. An empty page means
    no matching saved observations. It does not describe collection completeness.
servers:
  - url: http://127.0.0.1:8574
security:
  - bearerAuth: []
paths:
  /v1/capture-manifest:
    get: &readCaptureManifest
      operationId: readCaptureManifest
      summary: Read saved capture capabilities, retention and scoped counters
      description: >
        Pages use source kind and evidence ID ordering, not wall-clock ordering.
        Cursors bind to the Run. Live pagination can observe newly saved evidence;
        offline exports enumerate one frozen, explicitly selected snapshot.
        A failed object hash check or invalid saved identity returns an error.
        Sentry observations select one deterministic retained witness per scoped
        connection, protocol message, syscall number and stage. Every positive
        loss delta, counter-reset or identity-gap observation is also retained. Witness selection
        is recomputed inside the export selection, never from excluded evidence.
        Ordinary record observations describe process-table polling and optional
        workspace snapshots. Their counters belong to one recorded attempt;
        missed processes remain unknown. Separate native collectors retain their
        own capabilities and observations.
        JSONL batch receipts preserve original processing counts and input/event
        digests. Their upstream capability, placement and loss remain unknown.
        Partial exports retain a receipt only when all its supporting events
        are included; receipt counts are never rewritten for a selection.
      parameters:
        - {name: run, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 1024}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 8192}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        '200':
          description: Saved observations with explicit unknown values
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Page'}
        '400': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
        '401': {description: The daemon requires its configured bearer token}
        '403': {description: The existing local Host and Origin guard rejects the request}
  /api/capture-manifest:
    get:
      <<: *readCaptureManifest
      operationId: readDashboardCaptureManifest
      security: []
      description: >
        Dashboard alias protected by the existing local read guard. New static
        and file-based replays support this path, the same pagination parameters
        and an additional selection_scope field. Older replay artifacts without
        this index return an unavailable error. No reader-host probing occurs.
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  responses:
    Error:
      description: English saved-evidence query error
      content:
        application/json:
          schema:
            type: object
            required: [schema_version, error]
            properties:
              schema_version: {const: agentprovenance.capture_manifest/v1}
              error:
                type: object
                required: [code, message]
                properties:
                  code: {enum: [invalid_argument, capture_evidence_read_failed, method_not_allowed]}
                  message: {type: string}
  schemas:
    Page:
      type: object
      required: [schema_version, run_id, basis, records, limit, has_more]
      properties:
        schema_version: {const: agentprovenance.capture_manifest/v1}
        run_id: {type: string}
        basis: {const: saved_observations}
        selection_scope: {enum: [whole_run, selected_evidence], description: Present in offline readers only}
        records: {type: array, items: {$ref: '#/components/schemas/Record'}}
        limit: {type: integer, minimum: 1, maximum: 200}
        has_more: {type: boolean}
        next_cursor: {type: string}
    Record:
      type: object
      required: [id, evidence_ref, evidence_kind, source, producer_version, producer_commit, placement, identity_domain, identity, interval_basis, status, snapshots, retention, loss, issues]
      properties:
        id: {type: string, description: Source kind followed by the original evidence ID}
        evidence_ref: {type: string, description: Original object hash or runtime_event or telemetry_batch reference}
        evidence_kind: {enum: [object, event, batch]}
        source: {type: string}
        producer_version: {type: string, description: Recorded version or unknown}
        producer_commit: {type: string, description: Recorded source identity or unknown}
        placement: {type: string, description: Recorded collection location or the saved record's location class}
        identity_domain: {type: string}
        identity:
          type: object
          additionalProperties: {type: string}
          description: >
            Saved scope identities retain their observation domains. Runtime
            execution checkpoints may include runtime_mode, runtime_container_id,
            runtime_release and runtime_operation_id. sentry_pid is a Sentry PID,
            never a host PID. Guest platform bindings retain runtime_class,
            runtime_handler, pod_uid and guest_boot_id with
            platform_basis=recorded_platform_binding; the Sensor's independently
            recorded boot_id remains in each capability snapshot.
        observed_at: {type: string}
        started_at: {type: string}
        ended_at: {type: string}
        interval_basis:
          enum: [recorded_observation, boundary_samples, recorded_capability_changes, collector_receive_window, source_processing_range, run_configuration, stream_observation, checkpoint_observation, recorder_observation]
          description: >
            Native capability changes are retained as individual intervals with
            their collector and capability revision. Historical boundary samples
            leave changes between the observations unspecified.
            checkpoint_observation identifies a saved Sentry event, not a
            continuous enabled interval or an enumeration of all events.
            recorder_observation identifies the recorder's saved start, end or
            error boundary. Polling times and settings remain source-qualified.
            collector_receive_window identifies an original native spool receive
            window, retaining batch and receiver identities through late binding
            and restart. An unsealed window reports its last observation and the
            collector_receive_window_unsealed issue, not a workload end time.
        status: {type: string, description: Original source status; not a unified completeness verdict}
        observation: {$ref: '#/components/schemas/Observation'}
        execution_state:
          type: object
          description: Original checkpoint axes, available for execution checkpoints; historical missing values remain empty
          required: [execution, capture, delivery]
          properties:
            execution: {type: string}
            capture: {type: string}
            delivery: {type: string}
        snapshots:
          type: array
          items:
            type: object
            required: [boundary, status, ready, features]
            properties:
              observed_at: {type: string}
              boundary: {type: string}
              status: {type: string}
              reason: {type: string}
              identity: {type: object, additionalProperties: {type: string}, description: 'Boundary-qualified collector identity when saved; Sentry snapshots retain only the selected receiver target and its connection ID'}
              ready: {type: [boolean, 'null']}
              features: {type: array, items: {$ref: '#/components/schemas/Feature'}}
              observation: {$ref: '#/components/schemas/Observation'}
        retention:
          type: array
          items:
            type: object
            required: [category, enabled, basis]
            properties:
              category: {type: string}
              enabled: {type: [boolean, 'null']}
              basis: {type: string}
        loss:
          type: array
          items: &captureCounter
            type: object
            required: [name, scope, value, basis]
            properties:
              name: {type: string}
              scope: {enum: [run, node, collector, scope_prefix, processing_range, sentry_connection, recorder]}
              scope_id: {type: string, description: Collector, Sentry connection or recorder attempt identity}
              value:
                type: [string, 'null']
                pattern: '^[0-9]+$'
                description: Decimal text preserves uint64 precision; null means unknown
              basis: {type: string, description: Delta, cumulative boundary or original processing-range count}
        counts:
          type: array
          description: >
            Optional processing counters, separate from capture loss. JSONL
            receipts contain read, ingested, skipped, failed and unclassified.
            Unclassified rows have no saved disposition; do not treat them as
            kernel losses. Observed time is receipt persistence time.
          items: *captureCounter
        issues: {type: array, items: {type: string}}
    Observation:
      type: object
      description: >
        Versioned projection from the referenced saved evidence. Optional in
        historical serialized readers. Scope references are qualified by the
        containing record's identity, including instance and generation.
        Collector scope describes capabilities, not workload-wide coverage.
      required: [rule_version, layer, layer_basis, scope_kind, evidence_refs]
      properties:
        rule_version: {const: agentprov.capture_observation/v1}
        layer:
          enum: [host_kernel, guest_kernel, sentry, application, unknown, mixed]
          description: mixed summarizes differing boundary observations; inspect each snapshot
        layer_basis: {type: string, description: Saved producer declaration or source protocol; unspecified kernel topology stays unknown}
        scope_kind: {type: string}
        scope_ref: {type: string}
        evidence_refs: {type: array, items: {type: string}}
    Feature:
      type: object
      required: [name, category, supported, enabled, state, basis]
      properties:
        name: {type: string}
        category: {type: string}
        target: {type: string}
        supported: {type: [boolean, 'null']}
        enabled: {type: [boolean, 'null']}
        observed:
          type: boolean
          description: >
            Whether retained source evidence witnesses this feature. For Sentry,
            it identifies a protocol message and stage; for record, an owned
            process or successful process-table sample. Omitted for support
            declarations and sources without that observation. Enabled remains
            null without saved enablement evidence.
        state: {type: string}
        basis: {type: string}
        reason: {type: string}
        policy_subject:
          type: object
          description: State sampling configuration only; actual policy decisions retain their own task identities
          required: [layer, role, basis]
          properties:
            layer: {enum: [host_kernel, guest_kernel, unknown]}
            role: {const: unknown}
            basis: {const: state_collection_configuration}
