openapi: 3.1.0
info:
  title: AgentProvenance execution handoff API
  version: "1.0"
  description: >
    Opt-in authenticated single-router execution API. Admission is durable and
    independent of the HTTP connection. Command completion, capture sealing and
    evidence acknowledgement are separate states. See execution-handoff.md.
servers:
  - url: http://127.0.0.1:8574
security:
  - bearerAuth: []
paths:
  /v1/execution-links:
    get: &readExecutionLinks
      operationId: readExecutionLinks
      summary: Read bidirectional links from locally saved admission and delivery evidence
      description: >
        This read API does not contact an executor. Outgoing links start at a caller Run;
        incoming links start at an execution Run. Native filters apply within a bounded
        scanned page, so an empty filtered page can still have a next_cursor.
        Incoming links select the latest saved package version per admission.
      parameters:
        - { name: run, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 512 } }
        - { name: direction, in: query, schema: { type: string, enum: [outgoing, incoming], default: outgoing } }
        - { name: harness, in: query, schema: { type: string, maxLength: 512 } }
        - { name: session, in: query, schema: { type: string, maxLength: 512 } }
        - { name: tool_call, in: query, schema: { type: string, maxLength: 512 } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 4096 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Saved links with qualified identities and separate evidence states
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecutionLinksPage' }
        default:
          description: English read error; malformed queries fail instead of returning a partial result
          content:
            application/json:
              schema:
                type: object
                required: [schema_version, error]
                properties:
                  schema_version: { const: agentprovenance.execution_links/v1 }
                  error:
                    type: object
                    required: [code, message]
                    properties:
                      code: { enum: [invalid_argument, evidence_read_failed, method_not_allowed] }
                      message: { type: string }
  /api/execution-links:
    get:
      <<: *readExecutionLinks
      operationId: readDashboardExecutionLinks
      security: []
      description: >
        Dashboard alias for the local saved-evidence query, protected by its existing
        Host and Origin guard instead of daemon bearer authentication. It supports
        the same bounded pagination and native identity filters.
  /v1/executions:
    post:
      operationId: submitExecution
      summary: Admit one independent command or return an existing operation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Request' }
      responses:
        '202':
          description: Attempt durably accepted; Location identifies its status URL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Admission' }
        '200':
          description: Previously admitted operation returned without reexecution
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Admission' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    get:
      operationId: listExecutions
      summary: List attempts for one native Tool Call in the authenticated namespace
      parameters:
        - { name: run, in: query, required: true, schema: { type: string } }
        - { name: harness, in: query, required: true, schema: { type: string } }
        - { name: session, in: query, required: true, schema: { type: string } }
        - { name: tool_call, in: query, required: true, schema: { type: string } }
        - { name: after, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Bounded sequence-ordered page; next_after is present only with more results
          content:
            application/json:
              schema:
                type: object
                required: [schema_version, attempts]
                properties:
                  schema_version: { const: agentprovenance.execution_handoff/v1 }
                  attempts: { type: array, items: { $ref: '#/components/schemas/Attempt' } }
                  next_after: { type: integer, minimum: 1 }
        default: { $ref: '#/components/responses/Error' }
  /v1/executions/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getExecution
      summary: Read attempt, last saved checkpoint and stop request state
      responses:
        '200':
          description: Coherent read of saved state and evidence
          content:
            application/json:
              schema:
                type: object
                required: [schema_version, attempt, stop_requested]
                properties:
                  schema_version: { const: agentprovenance.execution_handoff/v1 }
                  attempt: { $ref: '#/components/schemas/Attempt' }
                  stop_requested: { type: boolean }
                  checkpoint_ref: { type: string }
                  checkpoint: { $ref: '#/components/schemas/Checkpoint' }
        default: { $ref: '#/components/responses/Error' }
  /v1/executions/{id}/stop:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: stopExecution
      summary: Persist an idempotent stop request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [operation_id]
              properties:
                operation_id: { type: string, minLength: 1 }
      responses:
        '202':
          description: Request stored; consult execution state for the observed outcome
          content:
            application/json:
              schema:
                type: object
                required: [schema_version, attempt_id, operation_id, state, requested_at]
                properties:
                  schema_version: { const: agentprovenance.execution_handoff/v1 }
                  attempt_id: { type: string }
                  operation_id: { type: string }
                  state: { const: requested }
                  requested_at: { type: string, format: date-time }
        default: { $ref: '#/components/responses/Error' }
  /v1/executions/{id}/deliveries:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: prepareExecutionDelivery
      summary: Freeze a signed package or retrieve the same delivery operation
      description: A retired operation returns 410 execution_delivery_retired; use a new explicit operation to prepare another version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [operation_id]
              properties:
                operation_id: { type: string, minLength: 1 }
      responses:
        '201':
          description: Immutable package and outbox entry persisted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryResponse' }
        '200':
          description: Original package returned for a repeated operation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryResponse' }
        default: { $ref: '#/components/responses/Error' }
  /v1/execution-deliveries/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: '^[0-9a-f]{64}$' } }
    get:
      operationId: getExecutionDelivery
      summary: Read the signed manifest and any saved receiving receipt
      responses:
        '200':
          description: Saved delivery metadata; server filesystem paths are excluded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryResponse' }
        default: { $ref: '#/components/responses/Error' }
  /v1/execution-deliveries/{id}/bundle:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: '^[0-9a-f]{64}$' } }
    get:
      operationId: downloadExecutionDelivery
      summary: Download the immutable bytes bound by the signed manifest
      description: A retired sender copy returns 410 execution_delivery_retired. Its metadata and receipt remain queryable.
      responses:
        '200':
          description: Verified archive, streamed with Content-Length and no-store caching
          headers:
            ETag: { schema: { type: string }, description: Quoted sha256 digest of the exact body }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Error' }
  /v1/execution-deliveries/{id}/receipt:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: '^[0-9a-f]{64}$' } }
    post:
      operationId: acknowledgeExecutionDelivery
      summary: Verify and persist a pinned receiver's signed acknowledgment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Envelope' }
      responses:
        '200':
          description: Receipt saved, or identical package already acknowledged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryResponse' }
        default: { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  responses:
    Error:
      description: >
        English error code. Invalid input is 400, unauthenticated 401,
        unauthorized 403, unknown/disabled 404, conflict 409, expired request or retired delivery 410,
        oversized 413, storage failure 500, unavailable worker 503.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              schema_version: { const: agentprovenance.execution_handoff/v1 }
              error: { type: string }
  schemas:
    ExecutionIdentity:
      type: object
      additionalProperties: false
      required: [source, target, dispatch_id, attempt_id, request_hash, digest_version, local_run_id]
      properties:
        source: { $ref: '#/components/schemas/Source' }
        target: { $ref: '#/components/schemas/Target' }
        dispatch_id: { type: string }
        attempt_id: { type: string }
        request_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
        digest_version: { const: agentprovenance.execution_request_sha256/v1 }
        local_run_id: { type: string }
    SourceAdmission:
      type: object
      additionalProperties: false
      description: Immutable caller-side provenance payload recorded from authenticated admission; command bodies and credential paths are omitted.
      required: [schema_version, identity, principal_id, operation_id, attempt_number, accepted_at, target_key_sha256, receiver_id, receiver_key_sha256]
      properties:
        schema_version: { const: agentprovenance.execution_source_admission/v1 }
        identity: { $ref: '#/components/schemas/ExecutionIdentity' }
        principal_id: { type: string, minLength: 1 }
        operation_id: { type: string, minLength: 1 }
        previous_attempt_id: { type: string }
        attempt_number: { type: integer, minimum: 1 }
        accepted_at: { type: string, format: date-time }
        target_key_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        receiver_id: { type: string, minLength: 1 }
        receiver_key_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
    DeliveryEvidence:
      type: object
      additionalProperties: false
      required: [schema_version, admission_ref, manifest, receipt, target_verifier, receiver_verifier]
      properties:
        schema_version: { const: agentprovenance.execution_delivery_evidence/v1 }
        admission_ref: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        manifest: { type: string, contentEncoding: base64, maxLength: 87384, description: Original signed DSSE manifest bytes }
        receipt: { type: string, contentEncoding: base64, maxLength: 87384, description: Original signed DSSE receiving receipt bytes }
        target_verifier: { type: string, pattern: '^[0-9a-f]{64}$', description: Public Ed25519 verification material; pinned by the source admission fingerprint }
        receiver_verifier: { type: string, pattern: '^[0-9a-f]{64}$', description: Public Ed25519 verification material; pinned by the source admission fingerprint }
    ExecutionLink:
      type: object
      additionalProperties: false
      required: [identity, admission_ref, basis, issues]
      properties:
        identity: { $ref: '#/components/schemas/ExecutionIdentity' }
        admission_ref: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        admission: { $ref: '#/components/schemas/SourceAdmission' }
        delivery_ref: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        manifest: { $ref: '#/components/schemas/DeliveryManifest' }
        receipt: { $ref: '#/components/schemas/DeliveryReceipt' }
        checkpoint: { $ref: '#/components/schemas/Checkpoint' }
        basis:
          enum: [authenticated_admission, authenticated_delivery, unanchored_delivery]
          description: Admission-only, both signatures match the source anchor, or signed delivery whose source anchor is absent from this store
        issues: { type: array, items: { type: string } }
    ExecutionLinksPage:
      type: object
      additionalProperties: false
      required: [schema_version, run_id, direction, links, scanned, limit, has_more]
      properties:
        schema_version: { const: agentprovenance.execution_links/v1 }
        run_id: { type: string }
        direction: { enum: [outgoing, incoming] }
        links: { type: array, items: { $ref: '#/components/schemas/ExecutionLink' } }
        scanned: { type: integer, minimum: 0, maximum: 100 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        has_more: { type: boolean }
        next_cursor: { type: string, maxLength: 4096 }
    Envelope:
      type: object
      additionalProperties: false
      required: [payloadType, payload, signatures]
      description: DSSE/in-toto envelope, at most 64 KiB; verify with a configured public key
      properties:
        payloadType: { const: application/vnd.in-toto+json }
        payload: { type: string, contentEncoding: base64 }
        signatures:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [sig]
            properties:
              keyid: { type: string }
              sig: { type: string, contentEncoding: base64 }
    DeliveryManifest:
      type: object
      additionalProperties: false
      required: [schema_version, id, identity, receiver_id, package_version, attempt_revision, checkpoint_ref, state, bundle_sha256, bundle_bytes, snapshot_at]
      properties:
        schema_version: { const: agentprovenance.execution_delivery/v1 }
        id: { type: string, pattern: '^[0-9a-f]{64}$' }
        identity: { $ref: '#/components/schemas/ExecutionIdentity' }
        receiver_id: { type: string }
        package_version: { type: integer, minimum: 1 }
        previous_manifest_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        attempt_revision: { type: integer, minimum: 1 }
        checkpoint_ref: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        state: { $ref: '#/components/schemas/State' }
        bundle_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        bundle_bytes: { type: integer, minimum: 1, maximum: 268435456 }
        snapshot_at: { type: string, format: date-time, description: Export time for the frozen database view }
    Delivery:
      type: object
      additionalProperties: false
      required: [manifest, envelope, manifest_sha256]
      properties:
        manifest: { $ref: '#/components/schemas/DeliveryManifest' }
        envelope: { $ref: '#/components/schemas/Envelope' }
        manifest_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        receipt: { $ref: '#/components/schemas/Envelope' }
        storage: { $ref: '#/components/schemas/DeliveryStorage' }
    DeliveryStorage:
      type: object
      additionalProperties: false
      required: [state, retain_until]
      description: Local sender-copy retention, outside the immutable signed manifest. Omitted until a retention deadline is assigned. Retirement disables new downloads; purged_at records durable file removal.
      properties:
        state: { type: string, enum: [retained, retired] }
        retain_until: { type: string, format: date-time }
        retired_at: { type: string, format: date-time }
        purged_at: { type: string, format: date-time }
    DeliveryResponse:
      type: object
      additionalProperties: false
      required: [schema_version, delivery, reused]
      properties:
        schema_version: { const: agentprovenance.execution_delivery/v1 }
        delivery: { $ref: '#/components/schemas/Delivery' }
        reused: { type: boolean }
    DeliveryReceipt:
      type: object
      additionalProperties: false
      required: [schema_version, delivery_id, identity, receiver_id, package_version, manifest_sha256, bundle_sha256, bundle_bytes, status, received_at]
      description: Authenticated predicate inside the receipt envelope
      properties:
        schema_version: { const: agentprovenance.execution_receipt/v1 }
        delivery_id: { type: string, pattern: '^[0-9a-f]{64}$' }
        identity: { $ref: '#/components/schemas/ExecutionIdentity' }
        receiver_id: { type: string }
        package_version: { type: integer, minimum: 1 }
        manifest_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        bundle_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        bundle_bytes: { type: integer, minimum: 1, maximum: 268435456 }
        status: { const: persisted }
        received_at: { type: string, format: date-time }
    Source:
      type: object
      additionalProperties: false
      required: [producer_id, namespace, run_id, harness, session_id, tool_call_id]
      properties:
        producer_id: { type: string, minLength: 1 }
        namespace: { type: string, minLength: 1 }
        run_id: { type: string, minLength: 1 }
        harness: { type: string, minLength: 1 }
        session_id: { type: string, minLength: 1 }
        tool_call_id: { type: string, minLength: 1 }
    Target:
      type: object
      additionalProperties: false
      required: [producer_id, instance_id, generation]
      properties:
        producer_id: { type: string, minLength: 1 }
        instance_id: { type: string, minLength: 1 }
        generation: { type: string, minLength: 1 }
    Command:
      type: object
      additionalProperties: false
      required: [argv]
      properties:
        argv: { type: array, minItems: 1, maxItems: 256, items: { type: string } }
        workdir: { type: string, default: '' }
        disable_snapshot: { type: boolean, default: false }
        sample_interval_ms: { type: integer, minimum: 0, maximum: 60000, default: 25 }
        post_root_grace_ms: { type: integer, minimum: 0, maximum: 30000, default: 250 }
        capture_preset: { type: string, enum: [basic, detailed], default: detailed }
        tool_results: { type: boolean }
    Request:
      type: object
      additionalProperties: false
      required: [schema_version, source, target, dispatch_id, operation_id, valid_until, command]
      properties:
        schema_version: { const: agentprovenance.execution_handoff/v1 }
        source: { $ref: '#/components/schemas/Source' }
        target: { $ref: '#/components/schemas/Target' }
        dispatch_id: { type: string, minLength: 1 }
        operation_id: { type: string, minLength: 1 }
        previous_attempt_id: { type: string }
        valid_until: { type: string, format: date-time }
        command: { $ref: '#/components/schemas/Command' }
    State:
      type: object
      required: [execution, capture, delivery]
      properties:
        execution: { enum: [accepted, starting, running, succeeded, failed, cancelled, unknown] }
        capture: { enum: [not_ready, collecting, draining, sealed, incomplete] }
        delivery: { enum: [pending, transferring, acknowledged, conflict] }
    Attempt:
      type: object
      required: [schema_version, sequence, id, attempt_number, request_hash, digest_version, request, local_run_id, state, revision, created_at, updated_at]
      properties:
        schema_version: { const: agentprovenance.execution_handoff/v1 }
        sequence: { type: integer, minimum: 1 }
        id: { type: string }
        attempt_number: { type: integer, minimum: 1 }
        request_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
        digest_version: { const: agentprovenance.execution_request_sha256/v1 }
        request: { $ref: '#/components/schemas/Request' }
        local_run_id: { type: string }
        state: { $ref: '#/components/schemas/State' }
        revision: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Admission:
      type: object
      required: [schema_version, attempt, reused]
      properties:
        schema_version: { const: agentprovenance.execution_handoff/v1 }
        attempt: { $ref: '#/components/schemas/Attempt' }
        reused: { type: boolean }
    Output:
      type: object
      required: [state]
      properties:
        state: { enum: [stored, omitted, truncated, unavailable, unknown] }
        ref: { type: string, description: Content-addressed text manifest reference }
        observed_bytes: { type: integer, minimum: 0, description: Absent when not observed }
        retained_bytes: { type: integer, minimum: 0, description: Bytes after redaction; absent when unknown }
        reason: { type: string }
    Checkpoint:
      type: object
      required: [schema_version, attempt_id, revision, source, target, dispatch_id, request_hash, digest_version, state, reason, at]
      properties:
        schema_version: { const: agentprovenance.execution_handoff/v1 }
        attempt_id: { type: string }
        revision: { type: integer, minimum: 1 }
        source: { $ref: '#/components/schemas/Source' }
        target: { $ref: '#/components/schemas/Target' }
        dispatch_id: { type: string }
        request_hash: { type: string }
        digest_version: { const: agentprovenance.execution_request_sha256/v1 }
        state: { $ref: '#/components/schemas/State' }
        reason: { type: string }
        at: { type: string, format: date-time }
        scope:
          type: object
          required: [run_id, rollout_id, attempt_id, session_id, tool_call_id, process_id, base_snapshot_id, binding_id, cgroup_id, scope_kind, workdir, started_at]
          properties:
            run_id: { type: string }
            rollout_id: { type: string }
            attempt_id: { type: string }
            session_id: { type: string }
            tool_call_id: { type: string }
            process_id: { type: string }
            base_snapshot_id: { type: string }
            binding_id: { type: string }
            cgroup_id: { type: string }
            scope_kind: { enum: [cgroup, logical_process_scope] }
            workdir: { type: string }
            started_at: { type: string, format: date-time }
            root_pid: { type: integer, minimum: 1 }
            start_event_id: { type: string }
            recovery_anchor: { $ref: '#/components/schemas/ScopeRecoveryAnchor' }
            deadline_at: { type: string, format: date-time, description: Original execution deadline saved before launch; absent when no deadline applies }
        result:
          type: object
          description: Existing record result including exit code, observed descendants and artifact capture. Recovery can leave unavailable fields empty.
          properties:
            stop_report: { $ref: '#/components/schemas/ExecutionStopReport' }
            scope_observation: { $ref: '#/components/schemas/ScopeObservation' }
        stdout: { $ref: '#/components/schemas/Output' }
        stderr: { $ref: '#/components/schemas/Output' }
        error: { type: string }
        capture_report: { $ref: '#/components/schemas/NativeCaptureReport' }
        recovery_report: { $ref: '#/components/schemas/ScopeRecoveryReport' }
    ScopeRecoveryAnchor:
      type: object
      required: [schema_version, boot_id, filesystem_id]
      properties:
        schema_version: { const: agentprovenance.linux_cgroup_recovery/v1 }
        boot_id: { type: string, minLength: 1 }
        filesystem_id: { type: string, minLength: 1 }
      description: Saved before launch. Recovery verifies this anchor and scope.cgroup_id against the reopened cgroup v2 directory, retaining its descriptor for observation and stop.
    ScopeRecoveryReport:
      type: object
      required: [scope_observation]
      properties:
        scope_observation: { $ref: '#/components/schemas/ScopeObservation' }
        stop_report: { $ref: '#/components/schemas/ExecutionStopReport' }
      description: >
        Scope observation after executor restart. When no execution-end record
        survived, result is absent and output is unknown. Verified live scopes
        are monitored without rerunning the command; confirmed stop is cancelled,
        confirmed timeout is failed, and natural disappearance keeps execution
        unknown. Capture remains incomplete. Saved reports are included in signed
        delivery even when no exit code is available.
    ScopeObservation:
      type: object
      required: [scope_kind, cgroup_id, observed_at, empty]
      properties:
        scope_kind: { enum: [cgroup, logical_process_scope] }
        cgroup_id: { type: string }
        observed_at: { type: string, format: date-time }
        empty:
          type: [boolean, 'null']
          description: Population read through the owned cgroup descriptor before cleanup. Null when unavailable or observation failed.
        error: { type: string }
    NativeCaptureReport:
      type: object
      required: [schema_version, state, issues]
      properties:
        schema_version: { enum: [agentprovenance.execution_native_capture/v1, agentprovenance.execution_native_capture/v2] }
        state: { enum: [not_ready, collecting, draining, sealed, incomplete] }
        start: { $ref: '#/components/schemas/NativeCapturePoint' }
        end: { $ref: '#/components/schemas/NativeCapturePoint' }
        scope_observation: { $ref: '#/components/schemas/ScopeObservation' }
        shared_prefix: { $ref: '#/components/schemas/NativePrefixProgress' }
        scope_prefix: { $ref: '#/components/schemas/NativeScopePrefix' }
        scope_progress: { $ref: '#/components/schemas/NativePrefixProgress' }
        issues: { type: array, items: { type: string } }
        error: { type: string }
      description: >
        Fixed sensor and spool boundaries for the execution. Shared counters and
        backlog cover the collector, not an exact per-run loss count. Version 2
        uses scope_progress for closure, retaining shared_prefix independently.
        Scope counts include unclassified rows conservatively. Sealed describes
        a closed observed interval within the saved probe capabilities.
    NativeCapturePoint:
      type: object
      required: [scope, sensor, spool, capabilities]
      properties:
        scope: { $ref: '#/components/schemas/Checkpoint/properties/scope' }
        sensor: { $ref: '#/components/schemas/SensorBoundary' }
        spool: { $ref: '#/components/schemas/NativePrefix' }
        capabilities: { $ref: 'agent-context-api.yaml#/components/schemas/ProbeSnapshot' }
    SensorBoundary:
      type: object
      required: [schema_version, boundary, collector_id, sequence, kernel_time_ns, observed_at, decoded_records, kernel_drops, state_queue_drops, pending_tls_streams, pending_tls_bytes]
      properties:
        schema_version: { const: agentprovenance.sensor_boundary/v1 }
        boundary: { const: ring_and_decoder }
        collector_id: { type: string, minLength: 1 }
        sequence: { type: integer, minimum: 1 }
        kernel_time_ns: { type: integer, minimum: 1 }
        observed_at: { type: string, format: date-time }
        decoded_records: { type: integer, minimum: 0 }
        kernel_drops: { type: integer, minimum: 0 }
        state_queue_drops: { type: integer, minimum: 0 }
        tls_lost_streams:
          type: integer
          minimum: 0
          description: Collector-lifetime TLS reassembly loss; absent in earlier boundary records.
        tls_lost_bytes:
          type: integer
          minimum: 0
          description: Collector-lifetime TLS reassembly loss; absent in earlier boundary records.
        pending_tls_streams: { type: integer, minimum: 0 }
        pending_tls_bytes: { type: integer, minimum: 0 }
    NativePrefix:
      type: object
      required: [schema_version, boundary, collector_id, sequence, observed_at, counters, batches]
      properties:
        schema_version: { const: agentprovenance.native_spool_prefix/v1 }
        boundary: { const: accepted_spool }
        collector_id: { type: string, minLength: 1 }
        sequence: { type: integer, minimum: 0 }
        observed_at: { type: string, format: date-time }
        counters:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
        batches:
          type: array
          maxItems: 4096
          items:
            type: object
            required: [id, sha256, event_count]
            properties:
              id: { type: string, minLength: 1 }
              sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
              event_count: { type: integer, minimum: 0, maximum: 4096 }
    NativeScopePrefix:
      type: object
      required: [schema_version, collector_id, cgroup_id, after_sequence, through_sequence, observed_at, batches]
      properties:
        schema_version: { const: agentprovenance.native_scope_prefix/v1 }
        collector_id: { type: string, minLength: 1 }
        cgroup_id: { type: string, minLength: 1 }
        after_sequence: { type: integer, minimum: 0 }
        through_sequence: { type: integer, minimum: 0 }
        observed_at: { type: string, format: date-time }
        batches:
          type: array
          maxItems: 4096
          items:
            type: object
            required: [id, sha256, event_count, first_sequence, matched_events, unscoped_events]
            properties:
              id: { type: string, minLength: 1 }
              sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
              event_count: { type: integer, minimum: 1, maximum: 4096 }
              first_sequence: { type: integer, minimum: 1 }
              matched_events: { type: integer, minimum: 0, maximum: 4096 }
              unscoped_events: { type: integer, minimum: 0, maximum: 4096 }
      description: >
        Complete accepted sequence interval in one collector epoch. Batch hashes
        and membership counts survive payload cleanup. Different cgroups and
        earlier/later intervals remain separately accounted for.
    NativePrefixProgress:
      type: object
      required: [state, observed_at, batches, pending_batches, events, ingested, dropped, failed, pending, cleanup_pending]
      properties:
        state: { enum: [pending, settled] }
        observed_at: { type: string, format: date-time }
        batches: { type: integer, minimum: 0 }
        pending_batches: { type: integer, minimum: 0 }
        events: { type: integer, minimum: 0 }
        ingested: { type: integer, minimum: 0 }
        dropped: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        sampling_gaps:
          type: integer
          minimum: 0
          description: Persisted procfs observations with unavailable task or security state; a subset of ingested, not pending or dropped. Absent from older reports.
        pending: { type: integer, minimum: 0 }
        cleanup_pending: { type: integer, minimum: 0 }
        last_error: { type: string }
    ExecutionStopReport:
      type: object
      required: [method, requested_at, observed_at, signal_sent, scope_empty]
      properties:
        method: { enum: [cgroup_kill, process_group, root_process] }
        requested_at: { type: string, format: date-time }
        observed_at: { type: string, format: date-time }
        signal_sent:
          type: boolean
          description: The selected stop method accepted the signal; scope population is observed separately.
        scope_empty:
          type: [boolean, 'null']
          description: True when the owned cgroup subtree was observed empty, false when still populated after the bounded wait, null when unavailable or observation failed.
        error: { type: string }
