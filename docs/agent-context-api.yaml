openapi: 3.1.0
info:
  title: AgentProvenance recorded context API
  version: "1.13"
  description: >
    Read-only recorded evidence. Source assertions are not kernel observations
    or inferred authorizations. The dashboard exposes the same routes under
    /api/context instead of /v1/context. Native identifiers and status codes are
    language-independent. Existing records may lack newer source fields.
servers:
  - url: http://127.0.0.1:8574
security: [{bearerAuth: []}, {}]
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  parameters:
    run: {name: run, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 512}}
  schemas:
    NullableCount:
      type: [integer, "null"]
      minimum: 0
      description: Null means not known; zero means observed zero within the stated processing range.
    Source:
      type: object
      required: [id, harness, session_id, parser_version, binding]
      properties:
        id: {type: string}
        harness: {type: string}
        channel: {type: string, examples: [transcript, hooks]}
        session_id: {type: string}
        parent_session_id: {type: string}
        agent_id: {type: string}
        path: {type: string, description: Source location at capture; never required for offline content reads.}
        parser_version: {type: string}
        application_version: {type: string}
        format_version: {type: string}
        binding: {type: string, examples: [explicit, exact, matched, ambiguous, unknown], description: Matched is unique source metadata and time-window attribution, not kernel-proven identity.}
        binding_evidence: {type: array, items: {type: string}}
        workdir: {type: string}
        notebook: {$ref: '#/components/schemas/NotebookScope'}
        browser: {$ref: '#/components/schemas/BrowserScope'}
    BrowserScope:
      type: object
      required: [producer_id, namespace, instance_id, generation, browser_id, context_id]
      properties:
        producer_id: {type: string}
        namespace: {type: string}
        instance_id: {type: string}
        generation: {type: string}
        browser_id: {type: string}
        context_id: {type: string}
      description: Local placement and native Chromium browser/context identity. The source session is qualified by every field; opening the same URL never merges contexts.
    BrowserOperation:
      type: object
      required: [scope, target_id, operation_id, operation]
      properties:
        scope: {$ref: '#/components/schemas/BrowserScope'}
        target_id: {type: string, minLength: 1}
        operation_id: {type: string, minLength: 1}
        operation: {type: string, enum: [navigate, click, read_text, screenshot]}
        result_operation: {type: string, enum: [execute, read], description: Execute is an action result; read is a durable receipt lookup and does not dispatch the action again.}
        receipt: {$ref: '#/components/schemas/BrowserReceiptObservation'}
      description: >
        Versioned execution-result reference from the Browser MCP entry. Retained
        independently of optional bodies. Exact scope, page and operation identity
        can resolve to a captured operation in the same Run; conflicting claims
        remain unresolved. Read-only result queries create no new execution link.
    BrowserEvent:
      type: object
      required: [event_id, kind, redirect_index, association]
      properties:
        event_id: {type: string}
        kind: {type: string, enum: [target, frame, request, response, request_finished, request_failed, action_accept, action_start, action_end, action_result, screenshot, download, download_finished, har, gap, closed]}
        request_keys:
          type: array
          maxItems: 4096
          items: {type: string}
          description: Native request keys supporting a HAR archive. Withholding a supporting request observation withholds the whole archive from a reading copy.
        target_id: {type: string}
        target_type: {type: string, enum: [page, iframe, worker, service_worker]}
        cdp_session_id: {type: string}
        frame_id: {type: string}
        loader_id: {type: string}
        request_id: {type: string}
        redirect_index: {type: integer, minimum: 0, maximum: 25000}
        request_key: {type: string, description: Digest-qualified context/CDP-session/request/redirect-hop identity.}
        initiator_request_id: {type: string, description: Native initiator reference within the CDP session; retained without inferring a tool-call cause.}
        operation_id: {type: string}
        operation: {type: string}
        download_id: {type: string}
        association: {type: string, enum: [browser_context, browser_target, native_request, tool_operation, native_download]}
        url: {type: string, description: HTTP destination/path, with userinfo and fragments removed and the whole query replaced.}
        method: {type: string}
        http_status: {type: integer}
        receipt: {$ref: '#/components/schemas/BrowserReceiptObservation'}
      description: >
        Native identities survive basic retention. Request observations have no
        tool_call_id based on timing; service-worker requests may have no frame.
        Raw content is a privacy projection without transport headers, cookies
        or POST bodies. Screenshot references use the existing attachment API.
    BrowserReceiptObservation:
      type: object
      required: [phase, origin, authentication, digest_status, receipt]
      properties:
        phase: {type: string, enum: [accept, result]}
        origin: {type: string, enum: [transcript, external_file, local_operator]}
        authentication: {type: string, enum: [unverified]}
        digest_status: {type: string, enum: [source_asserted, not_recorded]}
        receipt: {$ref: '#/components/schemas/BrowserReceipt'}
      description: >
        Preserved source observation, independent of optional text retention.
        Its hashes and bridge identity are source claims. Receiver-side trust
        and verified bridge bindings are recorded separately, not granted by
        a transcript or by a local-operator import assertion.
    BrowserReceipt:
      type: object
      required: [schema_version, scope, target_id, operation_id, action, normalized_input_digest, input_digest_basis, input_redactions, accepted_at, started_at, ended_at, sequence, run_id, caller_session_id, caller_tool_call_id, capture_epoch, outcome, gap_refs, source_refs, result_digest]
      properties:
        schema_version: {type: string, const: agentprovenance.browser_operation_receipt/v1}
        scope: {$ref: '#/components/schemas/BrowserScope'}
        target_id: {type: string, minLength: 1}
        operation_id: {type: string, minLength: 1}
        action: {type: string, enum: [navigate, click, read_text, screenshot]}
        normalized_input_digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        input_digest_basis: {type: string, const: privacy_projected_input/v1}
        input_redactions:
          type: [array, "null"]
          maxItems: 3
          items: {type: string}
        accepted_at: {type: string, format: date-time}
        started_at: {type: [string, "null"], format: date-time}
        ended_at: {type: [string, "null"], format: date-time}
        sequence: {type: integer, minimum: 1, maximum: 25000}
        run_id: {type: [string, "null"]}
        caller_session_id: {type: [string, "null"]}
        caller_tool_call_id: {type: [string, "null"]}
        capture_epoch: {type: string, description: Captured browser incarnation; equals scope.browser_id.}
        outcome: {type: string, enum: [ok, unknown]}
        gap_refs:
          type: [array, "null"]
          maxItems: 16
          items: {type: string}
        source_refs:
          type: [object, "null"]
          maxProperties: 3
          propertyNames: {enum: [accept, start, end]}
          additionalProperties: {$ref: '#/components/schemas/BrowserReceiptSourceRef'}
        result_digest: {type: [string, "null"], pattern: '^sha256:[a-f0-9]{64}$'}
        bridge_identity: {$ref: '#/components/schemas/BrowserBridgeIdentity'}
        digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
      description: >
        An admission observation has unknown outcome, null start/end times,
        and no terminal digest. A result observation retains the terminal
        receipt, source references and bridge claims. A missing terminal result
        remains unknown; querying it does not repeat an action.
    BrowserReceiptSourceRef:
      type: object
      required: [log, event_id, sha256]
      properties:
        log: {type: string, description: Base name of the supporting JSONL journal.}
        event_id: {type: string}
        sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
    BrowserBridgePlacement:
      type: object
      required: [producer_id, namespace, instance_id, generation]
      properties:
        producer_id: {type: string}
        namespace: {type: string}
        instance_id: {type: string}
        generation: {type: string}
    BrowserBridgeIdentity:
      type: object
      required: [source, authentication, transcript_identity, identity]
      properties:
        source: {type: string, const: local_bridge_configuration}
        authentication: {type: string, enum: [unverified, verified], description: Receipt author's claim; effective receiver trust is evaluated separately.}
        transcript_identity: {type: string, const: source_asserted_only}
        identity: {$ref: '#/components/schemas/BrowserBridgePlacement'}
    NotebookScope:
      type: object
      required: [producer_id, namespace, instance_id, generation, notebook_id, kernel_id, kernel_session_id]
      properties:
        producer_id: {type: string}
        namespace: {type: string}
        instance_id: {type: string}
        generation: {type: string}
        notebook_id: {type: string}
        kernel_id: {type: string}
        kernel_session_id: {type: string}
      description: >
        Placement asserted by an explicitly selected local Jupyter capture.
        Generation is assigned by the launcher; kernel_session_id is observed
        in kernel_info_reply. Source.session_id is a digest-qualified identity
        over these fields. Restarting a kernel changes its session, while a
        reconnect to the same kernel can reuse it. This metadata grants no
        authenticated remote principal or per-cell operating-system attribution.
    NotebookRequest:
      type: object
      required: [scope, message_session, message_id]
      properties:
        scope: {$ref: '#/components/schemas/NotebookScope'}
        message_session: {type: string, minLength: 1, maxLength: 512}
        message_id: {type: string, minLength: 1, maxLength: 512}
      description: Native Jupyter request reference asserted by the selected MCP execution tool result. Retained independently of optional bodies. Resolution requires a unique caller and a matching current-Run request with the full scope. It does not grant a remote principal or per-cell kernel attribution.
    NotebookMessage:
      type: object
      required: [message_id, message_session, message_type, channel, direction, association]
      properties:
        message_id: {type: string}
        message_session: {type: string}
        message_type: {type: string}
        parent_message_id: {type: string}
        parent_session: {type: string}
        channel: {type: string, enum: [shell, control, iopub]}
        direction: {type: string, enum: [send, receive]}
        association: {type: string, enum: [native_request, native_parent_header, kernel_session]}
        observed_at: {type: string}
        execution_count: {type: integer, minimum: 0, description: Native display counter; never an association key.}
        omitted_content:
          type: array
          items:
            type: object
            required: [media_type, bytes, sha256, reason]
            properties:
              media_type: {type: string}
              bytes: {type: integer, minimum: 0}
              sha256: {type: string}
              reason: {type: string, examples: [attachment_not_retained, unsupported_media_type, invalid_base64, attachment_size_limit]}
              digest_scope: {type: string, enum: [source_json_value, decoded_source_bytes]}
            description: Digest and byte count use digest_scope; historical records without it describe the JSON-encoded source value.
      description: >
        Native message and parent headers retained in both capture presets.
        Only execute_reply reports the request outcome; IOPub output and idle
        may precede or follow other requests. Parentless output has kernel-level
        scope. raw_content.reason=notebook_protocol_projection identifies a
        reduced source representation without binary MIME data, arbitrary
        metadata or transport buffers. Text HTML remains inert saved text.
    Counts:
      type: object
      required: [discovered, matched, read, parsed, stored, duplicates, truncated, failed, unrecognized, deferred]
      properties:
        discovered: {$ref: '#/components/schemas/NullableCount'}
        matched: {$ref: '#/components/schemas/NullableCount'}
        read: {$ref: '#/components/schemas/NullableCount'}
        parsed: {$ref: '#/components/schemas/NullableCount'}
        stored: {$ref: '#/components/schemas/NullableCount'}
        duplicates: {$ref: '#/components/schemas/NullableCount'}
        truncated: {$ref: '#/components/schemas/NullableCount'}
        failed: {$ref: '#/components/schemas/NullableCount'}
        unrecognized: {$ref: '#/components/schemas/NullableCount'}
        deferred: {$ref: '#/components/schemas/NullableCount'}
    Issue:
      type: object
      required: [code]
      properties:
        code: {type: string}
        line: {type: integer, minimum: 1}
        field: {type: string}
        scope: {type: string, enum: [prior_context, current_execution], description: Identifies retained history or the selected execution range when present.}
      description: Bounded diagnostics contain no source message bodies or secrets.
    MissingSnapshotFields:
      type: array
      items: {type: string}
      description: >
        Absent source fields in this processing range, not effective permissions.
        Current parsers check task, configuration, approval, approval_decision and
        configuration.model/provider/application_version/workdir/permission_mode/
        approval_policy/sandbox_policy/directory_restrictions/network_restrictions/
        mcp_servers/tools/skills/plugins (each configuration field uses its own
        configuration. prefix). Explicit null/false/empty collections remain
        recorded values. configuration.change_history_completeness indicates
        that source snapshots do not establish exhaustive change history; it is
        retained even when all checked configuration values are present.
        Older reports retain their original checks; absence of a
        missing-field code is not proof of exhaustive coverage or valid permission.
    Coverage:
      type: object
      required: [schema_version, id, run_id, source, status, observed_at, counts, issues, missing_fields]
      properties:
        schema_version: {const: agentprovenance.agent_context/v1}
        id: {type: string}
        run_id: {type: string}
        source: {$ref: '#/components/schemas/Source'}
        status:
          type: string
          enum: [disabled, no_input, empty, ok, partial, failed, ambiguous, legacy_not_recorded]
        observed_at: {type: string, description: Processing observation timestamp, empty for legacy unknowns.}
        last_success_at: {type: string}
        started_at: {type: string, description: Earliest available source timestamp in the processing range.}
        ended_at: {type: string, description: Latest available source timestamp in the processing range.}
        first_line: {type: integer, minimum: 1}
        last_line: {type: integer, minimum: 1}
        counts: {$ref: '#/components/schemas/Counts'}
        issues: {type: array, items: {$ref: '#/components/schemas/Issue'}}
        missing_fields: {$ref: '#/components/schemas/MissingSnapshotFields'}
        object_hash: {type: string}
        prior_context: {$ref: '#/components/schemas/PriorContextRange'}
        capture_policy: {$ref: '#/components/schemas/CapturePolicy'}
        omissions: {type: array, items: {$ref: '#/components/schemas/CaptureOmission'}}
      description: Counts and timestamps describe the current selected range. An optional prior_context reports the retained prefix separately; status accounts for issues in either range.
    CapturePolicy:
      type: object
      required: [version, preset, tool_results, source_records, history, configuration]
      properties:
        version: {const: agentprovenance.context_capture/v1}
        preset: {type: string, enum: [basic, detailed]}
        tool_results: {type: boolean}
        source_records: {type: boolean}
        history: {type: boolean}
        configuration: {type: boolean}
        attachments: {type: boolean, description: Optional independent raster-retention override. When absent, follows tool_results. Historical entries are unchanged.}
        overrides:
          type: object
          additionalProperties: false
          properties:
            tool_results: {type: boolean}
      description: >
        Immutable additional-context retention settings for new writes in this run.
        Omitted on older evidence with no recorded policy. Sensor, TLS and workspace
        snapshots are configured independently. Excluding tool results also excludes
        raw source records and opaque source-state bodies that may embed them.
    CaptureSettings:
      type: object
      required: [version, source, sensor_mode, workspace_snapshot, tls_full_body, agent_context]
      properties:
        version: {const: agentprovenance.capture_settings/v1}
        source: {const: launch}
        sensor_mode: {type: string, enum: [auto, "off"]}
        workspace_snapshot: {type: boolean}
        tls_full_body: {type: boolean}
        agent_context: {type: boolean}
        ref: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
      description: >
        Immutable options saved before launch starts its collector or workload.
        Independent of additional-context retention. Workspace snapshots include
        a baseline working-tree copy and bounded changed-file text. TLS false
        retains hashes and short previews, not full bodies. These settings describe
        configured capture paths; runtime_coverage reports actual capture results.
        Omitted when historical evidence or another producer did not record them.
        Contains no environment values, credentials or local paths.
    CaptureOmission:
      type: object
      required: [category, reason, records]
      properties:
        category: {type: string, enum: [history, source_records, tool_result, configuration, approval, session_details]}
        reason: {const: capture_policy}
        records: {type: integer, minimum: 1}
      description: Normalized records affected in this processing range. Repeated source rows may affect several records; these are not unique raw-event or byte counts. Configured omissions do not change a successful processing status to partial.
    PriorContextRange:
      type: object
      required: [first_line, last_line, counts, missing_fields]
      properties:
        first_line: {type: integer, minimum: 1}
        last_line: {type: integer, minimum: 0}
        started_at: {type: string}
        ended_at: {type: string}
        counts: {$ref: '#/components/schemas/Counts'}
        missing_fields: {$ref: '#/components/schemas/MissingSnapshotFields'}
      description: History read before the resume cursor. An empty current range remains empty even when history is retained. An absent range does not establish that the harness had no prior history.
    ContentRef:
      type: object
      required: [bytes, redacted, state]
      properties:
        ref: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        bytes: {$ref: '#/components/schemas/NullableCount'}
        sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        media_type: {type: string}
        redacted: {type: boolean}
        state: {type: string, enum: [stored, unavailable, omitted]}
        reason: {type: string, examples: [source_not_recorded, capture_limit, capture_policy, core_fields_only, derived_intent_projection]}
        digest_scope:
          type: string
          enum: [parsed_content, source_record, hook_record, stored_raster_bytes, stored_har_bytes]
          description: Omitted text scopes describe transient pre-redaction input without a stored ref. hook_record is the writer's timestamped and normalized JSON before filtering. stored_raster_bytes identifies the retained, metadata-stripped image bytes; pixel content is unredacted. stored_har_bytes identifies the retained privacy-projected archive bytes. Stored text keeps its existing redacted-byte digest semantics.
    SessionMetadata:
      type: object
      properties:
        forked_from_id:
          type: string
          minLength: 1
          maxLength: 512
          description: Native Codex origin session ID for a fork, at most 512 UTF-8 bytes with no surrounding whitespace. The destination is Entry.source.session_id; this is fork lineage, not Source.parent_session_id or subagent delegation.
      description: >
        Optional typed metadata from a validated Codex configuration entry with
        status session_metadata, extracted before retention can omit the body.
        An empty object records an observed absence of a declared fork. An absent
        Entry.session_metadata means this metadata was not retained or validated, including older
        entries; it does not assert absence of a fork. Entry.run_id and Entry.source
        provide run, harness and source identity, and Entry.id plus object_hash
        identify the evidence used by session-relations. No duplicate endpoint or
        evidence identifiers are embedded in this object.
    Entry:
      type: object
      required: [schema_version, id, run_id, source, source_key, sequence, kind, content, raw_content]
      properties:
        schema_version: {const: agentprovenance.agent_context/v1}
        id: {type: string}
        run_id: {type: string}
        source: {$ref: '#/components/schemas/Source'}
        source_key: {type: string}
        sequence: {type: integer, minimum: 0, description: Physical source line order, not a cross-source clock.}
        source_ordinal: {type: integer, minimum: 0, description: Normalized record position within its physical line. Positive when recorded; zero or absent means an older producer did not record it.}
        execution_scope:
          type: string
          enum: [current_execution, prior_context]
          description: Optional source-position scope. Prior context cannot project current tool/model calls or imply current authorization. Current execution means within the selected source range, not independently verified runtime execution. Absent on older entries and explicit records without a recorded boundary.
        kind: {type: string, enum: [message, tool_call, tool_result, task, configuration, approval, session]}
        role: {type: string}
        agent_id: {type: string}
        tool_call_id: {type: string}
        tool_name: {type: string}
        status:
          type: string
          description: >
            Source outcome or representation; requested is not approved and
            returned does not assert success. source_message_event and
            source_reasoning_event preserve Codex event forms separately from
            response_item records. Equal text does not merge source identities.
            model_proposal is a source model decision, not execution proof.
            completion_only has no recorded start and cannot seed runtime
            attribution. context_replacement preserves a compacted tool result
            without overwriting the original outcome or creating a new execution.
        recorded_at: {type: string}
        content: {$ref: '#/components/schemas/ContentRef'}
        raw_content: {$ref: '#/components/schemas/ContentRef'}
        intent_content:
          allOf: [{$ref: '#/components/schemas/ContentRef'}]
          description: Optional derived Claude model-message projection when raw source records are omitted. Retains supported prompt, thinking, answer and proposed tool fields for reanalysis. It is not an original transcript. Sharing exclusions apply to the whole source row, including this projection.
        session_metadata: {$ref: '#/components/schemas/SessionMetadata'}
        notebook: {$ref: '#/components/schemas/NotebookMessage'}
        notebook_request: {$ref: '#/components/schemas/NotebookRequest'}
        browser_operation: {$ref: '#/components/schemas/BrowserOperation'}
        browser: {$ref: '#/components/schemas/BrowserEvent'}
        attachments: {type: array, maxItems: 32, items: {$ref: '#/components/schemas/AttachmentRef'}}
        missing_fields: {type: array, items: {type: string}}
        evidence_refs: {type: array, items: {type: string}}
        object_hash: {type: string}
        created_at: {type: string}
    EntryPage:
      type: object
      required: [schema_version, run_id, entries, has_more, limit]
      properties:
        schema_version: {const: agentprovenance.agent_context/v1}
        run_id: {type: string}
        entries: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/Entry'}}
        next_cursor: {type: string, description: Opaque continuation tied to this run and filters.}
        has_more: {type: boolean}
        limit: {type: integer, minimum: 1, maximum: 200}
    SearchSource:
      type: object
      required: [id, category, kind, label, content]
      properties:
        id: {type: string, description: Search catalog identity, distinct from a graph node.}
        category: {type: string, enum: [messages, tools, configuration, files, runtime]}
        kind: {type: string}
        label: {type: string}
        node: {type: string, description: Exact node or object hash accepted by /api/artifact.}
        graph_node: {type: string, description: Present when a recorded graph destination exists.}
        source_id: {type: string}
        harness: {type: string}
        session_id: {type: string}
        agent_id: {type: string}
        tool_call_id: {type: string}
        recorded_at: {type: string}
        execution_scope: {type: string, enum: [prior_context, current_execution]}
        entry: {$ref: '#/components/schemas/Entry'}
        session_association: {$ref: '#/components/schemas/SessionAuditRelation'}
        content:
          oneOf:
            - {$ref: '#/components/schemas/ContentRef'}
            - type: object
              required: [state]
              properties:
                state: {const: reader}
                bytes: {type: 'null'}
                redacted: {type: boolean}
              description: Use node with /api/artifact; availability is resolved by that reader.
    SearchSourcePage:
      type: object
      required: [schema_version, run_id, sources, has_more]
      properties:
        schema_version: {const: agentprovenance.search_sources/v1}
        run_id: {type: string}
        harness: {type: string}
        session_id: {type: string}
        sources: {type: array, maxItems: 50, items: {$ref: '#/components/schemas/SearchSource'}}
        has_more: {type: boolean}
        next_cursor: {type: string, description: Opaque continuation tied to run and native session scope.}
        session_audit: {$ref: '#/components/schemas/SessionAuditScope'}
    SessionAuditRelation:
      type: object
      required: [status, rule, basis]
      description: Read-only Session membership derived from an existing tool/runtime link and a unique audit operation. Also returned by the event-list session_associations map for records on that page. Original evidence identity is unchanged.
      properties:
        status: {type: string, enum: [inferred, unavailable]}
        rule: {const: agentprov.session_audit_operation/v1}
        basis: {const: recorded_tool_runtime_and_unique_audit_operation}
        reason: {const: replay_evidence_excluded}
        evidence_refs: {type: array, items: {type: string}, description: Supporting event and tool nodes. Withheld entirely when selected replay evidence cannot support the original relation.}
    SessionAuditScope:
      type: object
      required: [status, rule, related_count]
      description: Audit reading-scope analysis for the requested native Session, not a measurement of audit capture completeness. Also present in query.session_scope.audit on scoped graph responses.
      properties:
        status: {type: string, enum: [complete, incomplete]}
        rule: {const: agentprov.session_audit_operation/v1}
        related_count: {type: integer, minimum: 0}
        issues: {type: array, items: {type: string}}
    ComparisonRecord:
      type: object
      required: [dimension, key, label, operation, value, partial, evidence]
      properties:
        dimension: {type: string, enum: [task, configuration, files, network, outbound, access_control]}
        key: {type: string, description: Opaque comparable field or set identity; never a paired session or tool step.}
        label: {type: string}
        operation: {type: string, description: Recorded operation or existing outbound channel class.}
        evidence_kind:
          type: string
          enum: [configuration_declaration, state_snapshot, audit_decision, audit_status, collection_status, syscall_result, process_exit, thread_exit]
          description: Access-control evidence category. Audit actions and runtime results remain separate records.
        mechanism:
          type: string
          enum: [apparmor, seccomp, all]
          description: Recorded mechanism; all is only used for a combined audit-file reader. Absent on independent runtime results.
        comparison_scope:
          const: observed_set
          description: Compares sets of saved observations, not matched tasks or complete enforcement coverage. Repeated values retain all source references.
        value:
          oneOf:
            - {$ref: '#/components/schemas/SnapshotValue'}
            - {type: 'null'}
          description: Null means the recorded value is unavailable; a recorded JSON null has a SnapshotValue.
        partial: {type: boolean}
        evidence: {$ref: '#/components/schemas/SearchSource'}
    ComparisonIssue:
      type: object
      required: [source_id, dimension, code]
      properties:
        source_id: {type: string}
        dimension: {type: string}
        code: {type: string, description: Unavailable evidence, unrecorded field or projection limit.}
    ComparisonPage:
      type: object
      required: [schema_version, run_id, records, issues, sources_read, has_more]
      properties:
        schema_version: {const: agentprovenance.comparison_records/v1}
        run_id: {type: string}
        records: {type: array, items: {$ref: '#/components/schemas/ComparisonRecord'}}
        issues: {type: array, items: {$ref: '#/components/schemas/ComparisonIssue'}}
        sources_read: {type: integer, minimum: 0, maximum: 50}
        has_more: {type: boolean}
        next_cursor: {type: string, description: Opaque continuation bound to the whole run.}
    Overview:
      type: object
      required: [schema_version, run_id, coverage, messages, tool_calls, tool_results, snapshots, has_more_sources, runtime_coverage]
      properties:
        schema_version: {const: agentprovenance.agent_context/v1}
        run_id: {type: string}
        coverage: {type: array, maxItems: 256, items: {$ref: '#/components/schemas/Coverage'}}
        messages:
          allOf: [{$ref: '#/components/schemas/NullableCount'}]
          description: Saved message records including source-event representations and source-provided reasoning, not inferred unique messages or conversation turns.
        tool_calls: {$ref: '#/components/schemas/NullableCount'}
        tool_results: {$ref: '#/components/schemas/NullableCount'}
        snapshots: {$ref: '#/components/schemas/NullableCount'}
        has_more_sources: {type: boolean}
        runtime_coverage: {$ref: '#/components/schemas/RuntimeCoverage'}
        capture_policy: {$ref: '#/components/schemas/CapturePolicy'}
        capture_settings: {$ref: '#/components/schemas/CaptureSettings'}
      description: Latest report per source plus stored record counts including retained prior context, not estimates of current execution or uncaptured activity. Entry execution_scope and separate prior_context coverage distinguish the ranges.
    RuntimeCoverage:
      type: object
      required: [schema_version, run_id, capture, correlation]
      properties:
        schema_version: {const: agentprovenance.runtime_coverage/v1}
        run_id: {type: string}
        capture: {$ref: '#/components/schemas/RuntimeCapture'}
        correlation: {$ref: '#/components/schemas/RuntimeCorrelationCoverage'}
      description: Saved capture diagnostics and current stored-event scope fields, neither a signature result nor proof of complete activity capture.
    RuntimeCapture:
      type: object
      required: [schema_version, run_id, status, scope, kernel_state, node_counter_delta, node_pending_events, node_queued_bytes, run_dropped_events, run_impact, issues]
      properties:
        schema_version: {const: agentprovenance.runtime_capture/v1}
        run_id: {type: string}
        status: {type: string, enum: [disabled, no_input, ok, partial, failed, legacy_not_recorded]}
        scope: {type: string, enum: [node_capture_during_run, unknown]}
        kernel_state: {type: string, enum: [disabled, unavailable, observed, unknown]}
        started_at: {type: string, format: date-time}
        ended_at: {type: string, format: date-time}
        node_counter_delta:
          type: [object, "null"]
          additionalProperties: {type: integer, minimum: 0}
          description: Node-wide increments between capture snapshots, not per-run losses. Missing/reset counters are unknown; null means no usable interval measurement.
        node_pending_events: {$ref: '#/components/schemas/NullableCount'}
        node_queued_bytes: {$ref: '#/components/schemas/NullableCount'}
        run_dropped_events: {type: "null", description: No run-specific loss measurement is available; never apportion node losses to a run.}
        run_impact: {type: string, enum: [unknown, no_node_loss_reported]}
        capabilities_start: {$ref: '#/components/schemas/ProbeSnapshot'}
        capabilities_end: {$ref: '#/components/schemas/ProbeSnapshot'}
        capability_history: {$ref: '#/components/schemas/CapabilityHistoryRange'}
        issues: {type: array, items: {type: string}}
        limitations: {type: array, items: {type: string}, description: Optional probe or TLS visibility limits, separate from measured loss or processing errors. Absent in older reports.}
        rejection_examples:
          type: array
          maxItems: 64
          description: Bounded node-level validation diagnostics observed during capture, not per-run loss counts. No rejected bodies, paths or command arguments.
          items:
            type: object
            required: [timestamp, event_type, pid, cgroup_id, reason]
            properties:
              timestamp: {type: string, maxLength: 40}
              event_type: {type: string, maxLength: 64}
              pid: {type: integer}
              cgroup_id: {type: string, maxLength: 32}
              process_instance_id: {type: string, maxLength: 80}
              reason: {type: string, maxLength: 256}
        ref: {type: string, description: Saved capture report hash, verified on read and portable in the bundle.}
      description: >
        Written by launch before sealing. Endpoint snapshots do not prove continuous
        collector health or complete TLS coverage. Disabled kernel capture does not
        disable recorder events. Missing historical reports remain legacy_not_recorded;
        querying or importing a run never consults the current host's sensor status.
    CapabilityHistoryRange:
      type: object
      required: [saved_observations, status]
      properties:
        collector_id: {type: string}
        first_revision: {type: integer, minimum: 1}
        last_revision: {type: integer, minimum: 1}
        saved_observations: {type: integer, minimum: 0}
        status: {enum: [recorded, incomplete, not_recorded]}
        error: {type: string}
        issues: {type: array, items: {type: string}}
        limitations: {type: array, items: {type: string}}
      description: >
        Capture-side materialization of immutable native Sensor revisions for this
        Run. Each saved observation is a separate sensor_capability_interval object.
        Incomplete ranges retain their error and successfully saved observations.
        Older captures with no revision identity remain not_recorded.
    ProbeSnapshot:
      type: object
      required: [schema_version, updated_at, ready, status, probes, tls_discovery]
      properties:
        schema_version: {const: agentprovenance.sensor_capabilities/v1}
        updated_at: {type: string, format: date-time}
        changed_at: {type: string, format: date-time, description: Start of this reported capability revision; unchanged by counter-only updates.}
        collector_id: {type: string, description: One native Sensor lifetime; matches its kernel checkpointer when configured.}
        revision: {type: integer, minimum: 1}
        producer:
          type: object
          required: [name, version, commit, os, architecture, placement, placement_basis]
          properties:
            name: {const: agentprov-sensor}
            version: {type: string}
            commit: {type: string}
            os: {type: string}
            architecture: {type: string}
            kernel: {type: string}
            boot_id: {type: string}
            placement: {enum: [local_kernel, host_kernel, guest_kernel]}
            placement_basis: {enum: [local_kernel_only, operator_configuration]}
        ready: {type: boolean}
        status: {type: string, enum: [starting, ready, degraded, stopped, failed]}
        reason: {type: string}
        probes:
          type: array
          items:
            type: object
            required: [name, category, required, status]
            properties:
              name: {type: string}
              category: {type: string}
              target: {type: string}
              required: {type: boolean}
              status: {type: string, enum: [attached, detached, failed, disabled, unsupported, not_applicable]}
              reason: {type: string}
        tls_discovery:
          type: object
          properties:
            enabled: {type: boolean}
            scan_interval_ms: {type: integer}
            max_targets: {type: integer}
            max_processes_per_scan: {type: integer}
            active_targets: {type: integer}
            scan_complete: {type: boolean}
            processes_scanned: {type: integer}
            unreadable_processes: {type: integer}
            unresolved_mounts: {type: integer}
            truncated_maps: {type: integer}
            skipped_targets: {type: integer}
            unsupported_executables: {type: integer}
            sweep_passes: {type: integer, minimum: 0, description: Number of bounded periodic process-scan passes since sensor startup.}
            event_discovery:
              type: object
              description: Cumulative sensor-lifetime discovery counters. Hints select a process to inspect; they do not attribute a captured action. Attachment latency starts when the sensor consumes the triggering event.
              properties:
                queue_capacity: {type: integer, minimum: 0}
                pending: {type: integer, minimum: 0, description: Processes awaiting a scheduled retry; excludes completed coalescing entries.}
                hints: {type: integer, minimum: 0}
                coalesced: {type: integer, minimum: 0}
                queue_drops: {type: integer, minimum: 0}
                process_scans: {type: integer, minimum: 0}
                retry_scans: {type: integer, minimum: 0}
                exited_processes: {type: integer, minimum: 0}
                changed_processes: {type: integer, minimum: 0}
                unreadable_processes: {type: integer, minimum: 0}
                unresolved_mounts: {type: integer, minimum: 0}
                truncated_maps: {type: integer, minimum: 0}
                skipped_targets: {type: integer, minimum: 0}
                unsupported_executables: {type: integer, minimum: 0}
                attached_targets: {type: integer, minimum: 0}
                last_attach_latency_ms: {type: integer, minimum: 0}
                max_attach_latency_ms: {type: integer, minimum: 0}
            reason: {type: string}
            limitations: {type: [array, "null"], items: {type: string}}
    RuntimeCorrelationCoverage:
      type: object
      required: [schema_version, run_id, result_set_id, page_hash, summary, missing_fields, by_source, by_type, next_steps]
      properties:
        schema_version: {const: agentprovenance.observability_coverage/v1}
        run_id: {type: string}
        result_set_id: {type: string}
        page_hash: {type: string}
        summary:
          type: object
          required: [runtime_events, fully_correlated, missing_session, missing_tool_call, missing_process, fully_correlated_ratio, tool_call_coverage_ratio, process_coverage_ratio, correlation_gap_count]
          properties:
            runtime_events: {type: integer, minimum: 0}
            fully_correlated: {type: integer, minimum: 0, description: All three scope IDs are present; not proof of correct agent attribution.}
            missing_session: {type: integer, minimum: 0}
            missing_tool_call: {type: integer, minimum: 0}
            missing_process: {type: integer, minimum: 0}
            fully_correlated_ratio: {type: number, minimum: 0, maximum: 1}
            tool_call_coverage_ratio: {type: number, minimum: 0, maximum: 1}
            process_coverage_ratio: {type: number, minimum: 0, maximum: 1}
            correlation_gap_count: {type: integer, minimum: 0}
        missing_fields: {type: object, additionalProperties: {type: integer, minimum: 0}}
        by_source: {type: object, additionalProperties: {type: integer, minimum: 0}}
        by_type: {type: object, additionalProperties: {type: integer, minimum: 0}}
        next_steps: {type: array, items: {type: string}}
        gaps:
          type: array
          maxItems: 25
          items:
            type: object
            required: [event_id, source, type, missing, correlation_confidence, created_at, suggested_binding]
            properties:
              event_id: {type: string}
              raw_event_id: {type: string}
              source: {type: string}
              type: {type: string}
              missing: {type: array, items: {type: string}}
              correlation_method: {type: string}
              correlation_confidence: {type: number}
              container_id: {type: string}
              cgroup_id: {type: string}
              pid: {type: integer}
              ppid: {type: integer}
              created_at: {type: string}
              suggested_binding: {type: string}
      description: All stored runtime event rows in this run, with at most 25 gap examples in the context overview. Ratios are zero when the stored event count is zero, not an assessment of unobserved activity.
    ContentPage:
      type: object
      required: [schema_version, run_id, ref, content, media_type, offset, next_offset, total_bytes, has_more, sha256, redacted]
      properties:
        schema_version: {const: agentprovenance.content_page/v1}
        run_id: {type: string}
        ref: {type: string}
        content: {type: string, description: Redacted stored bytes decoded as UTF-8; never current disk content.}
        media_type: {type: string}
        offset: {type: integer, minimum: 0}
        next_offset: {type: integer, minimum: 0}
        total_bytes: {type: integer, minimum: 0, maximum: 33554432}
        has_more: {type: boolean}
        sha256: {type: string}
        redacted: {type: boolean}
    AttachmentRef:
      allOf:
        - {$ref: '#/components/schemas/ContentRef'}
        - type: object
          required: [source_media_type, source_bytes, source_sha256, source_digest_scope]
          properties:
            source_media_type: {type: string}
            source_bytes: {type: integer, minimum: 0}
            source_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
            source_digest_scope: {type: string, enum: [source_json_value, decoded_source_bytes]}
            width: {type: integer, minimum: 1, maximum: 8192}
            height: {type: integer, minimum: 1, maximum: 8192}
            transformation: {type: string, enum: [raster_reencode/v1, har_projection/v1]}
            privacy: {type: string, enum: [visual_content_unredacted, headers_cookies_query_bodies_omitted]}
      description: >
        Stored PNG/JPEG inputs become derived static PNG attachments with source
        and retained digests. Source metadata and trailing bytes are removed;
        pixels are not OCR-redacted. No image bytes occur in entry text. Limits:
        8 MiB source and saved image, 16 megapixels, 256 distinct attachment
        manifests and 64 MiB retained attachment bytes per run. HAR 1.2 archives
        use application/har+json with har_projection/v1 and stored_har_bytes;
        headers, cookies, query values and bodies are omitted. Native request
        IDs are checked against captured events. At most 4096 entries per HAR.
        Omitted records retain
        source identity and reasons; capture_policy is intentional omission.
    AttachmentPage:
      type: object
      required: [schema_version, run_id, ref, media_type, encoding, data, offset, next_offset, total_bytes, has_more, sha256]
      oneOf:
        - properties:
            schema_version: {const: agentprovenance.raster_attachment/v1}
            media_type: {const: image/png}
        - properties:
            schema_version: {const: agentprovenance.har_attachment/v1}
            media_type: {const: application/har+json}
      properties:
        schema_version: {type: string, enum: [agentprovenance.raster_attachment/v1, agentprovenance.har_attachment/v1]}
        run_id: {type: string}
        ref: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        media_type: {type: string, enum: [image/png, application/har+json]}
        encoding: {const: base64}
        data: {type: string, contentEncoding: base64, description: "A bounded page, not a complete attachment unless has_more is false and offset is zero."}
        offset: {type: integer, minimum: 0}
        next_offset: {type: integer, minimum: 0}
        total_bytes: {type: integer, minimum: 1, maximum: 8388608}
        has_more: {type: boolean}
        sha256: {type: string, pattern: '^[a-f0-9]{64}$', description: SHA-256 of all retained decoded attachment bytes.}
    ArtifactPage:
      type: object
      required: [schema_version, kind, content_state, mode, size, truncated, redacted, offset, next_offset, total_bytes, has_more]
      properties:
        schema_version: {const: agentprovenance.artifact_page/v1}
        kind: {type: string, enum: [text, diff, binary, unavailable]}
        ref: {type: string, description: 'Exact saved object hash, distinct from the displayed body hash.'}
        source: {type: string, enum: [object, db]}
        content_ref: {type: string, description: Chunked text manifest when present.}
        content_state: {type: string, examples: [stored, legacy_not_recorded, ambiguous, unavailable, integrity_failure, read_limit, binary, omitted, source_missing, binary_omitted, collection_limit, failed]}
        integrity: {type: string, enum: [object_hash_verified, database_record], description: Not a signature claim or a claim about capture completeness.}
        sha256: {type: string, pattern: '^[a-f0-9]{64}$', description: 'Hash of the whole redacted display body, including localized presentation headings in body mode.'}
        size: {type: integer, minimum: 0, description: Legacy size field; use nullable total_bytes to distinguish unknown from zero.}
        mime: {type: string}
        mode: {type: string, enum: [body, raw]}
        truncated: {type: boolean, description: Compatibility flag for a partial preview; has_more and next_offset permit reading the remaining saved text.}
        redacted: {type: boolean}
        content: {type: string, description: 'One UTF-8 page, at most 262144 bytes. Missing for unavailable content or an empty page.'}
        reason: {type: string}
        offset: {type: integer, minimum: 0}
        next_offset: {type: integer, minimum: 0}
        total_bytes: {$ref: '#/components/schemas/NullableCount'}
        has_more: {type: boolean}
        versions:
          type: array
          maxItems: 50
          items:
            type: object
            required: [ref, source_id]
            properties:
              ref: {type: string}
              source_id: {type: string}
        versions_has_more: {type: boolean}
        tls:
          type: object
          description: TLS/message capture metadata copied from the saved record. Independent of response paging and object integrity. Omitted for other evidence types; an absent capture field preserves unknown historical completeness.
          required: [truncated]
          properties:
            truncated: {type: boolean, description: Capture truncation recorded by the producer, not preview pagination.}
            content_encoding: {type: string}
            capture:
              type: object
              required: [rule, state, reason, data_kind]
              properties:
                rule: {type: string}
                state: {type: string}
                reason: {type: string}
                data_kind: {type: string}
                position:
                  type: object
                  properties:
                    stream_id: {type: string, pattern: '^[0-9]+$'}
                    call_sequence: {type: string, pattern: '^[0-9]+$'}
                    offset: {type: integer, minimum: 0}
                    total_bytes: {type: integer, minimum: 0}
                    checkpoint: {type: boolean}
      description: >
        Saved-only artifact or database-record preview. Legacy objects retain an
        8 MiB read budget; new stored text can span 32 MiB using bounded chunks.
        Multiple revisions require exact hash selection; current workspace files
        are never used to replace missing historical content. Raw mode shows the
        saved envelope, or the explicitly identified database record fields.
    CapturedArtifact:
      type: object
      required: [path, source_bytes, read_bytes, content_state, content_bytes, redacted, captured_at, capture_method]
      properties:
        path: {type: string, description: Workspace-relative selected path.}
        source_bytes: {$ref: '#/components/schemas/NullableCount'}
        read_bytes: {type: integer, minimum: 0}
        content_state: {type: string, enum: [stored, source_missing, binary_omitted, collection_limit, unavailable, failed]}
        content_ref: {type: string, description: Saved text manifest; absent when the body was omitted or its transaction failed.}
        content_bytes: {$ref: '#/components/schemas/NullableCount'}
        sha256: {type: string, pattern: '^[a-f0-9]{64}$', description: Full redacted body hash.}
        redacted: {type: boolean}
        captured_at: {type: string, format: date-time}
        capture_method: {const: post_execution_snapshot}
        reason: {type: string}
        reason_code: {type: string}
        ref: {type: string, description: Descriptor hash in the report; not stored recursively inside its own payload.}
      description: Final changed-file state, not an intermediate-write history or atomic filesystem snapshot.
    ArtifactCaptureReport:
      type: object
      required: [schema_version, status, method, candidates, stored, omitted, failed, stored_bytes, read_bytes, file_limit, per_file_byte_limit, total_byte_limit]
      properties:
        schema_version: {const: agentprovenance.artifact_capture/v1}
        status: {type: string, enum: [disabled, empty, ok, partial, failed]}
        method: {const: post_execution_snapshot}
        candidates: {$ref: '#/components/schemas/NullableCount'}
        stored: {type: integer, minimum: 0}
        omitted: {type: integer, minimum: 0}
        failed: {type: integer, minimum: 0}
        stored_bytes: {type: integer, minimum: 0}
        read_bytes: {type: integer, minimum: 0, description: Includes at most one extra limit-detection byte beyond the total text-read budget.}
        file_limit: {type: integer, const: 512}
        per_file_byte_limit: {type: integer, const: 33554432}
        total_byte_limit: {type: integer, const: 134217728}
        reason: {type: string}
        issues: {type: array, items: {type: string}}
        ref: {type: string, description: Report object hash in CLI JSON; not stored recursively in its own payload.}
        files: {type: array, maxItems: 512, items: {$ref: '#/components/schemas/CapturedArtifact'}}
      description: >
        Embedded as artifact_capture in record/launch JSON and persisted as an
        artifact_capture object in the bundle. Null candidates mean disabled or
        unknown selection, not zero changed files. Budgets apply to changed-file
        text capture, not baseline workspace snapshot/comparison I/O. Counts refer
        to saved/omitted/failed bodies; issues can separately report event/report
        storage failures. No additional HTTP route is implied by this schema.
    RuntimeCorrelationReport:
      type: object
      required: [schema_version, run_id, method, confidence, status, input_complete, observed_at, tool_calls, unclocked_calls, runtime_events, exec_events, matched_execs, inherited_execs, ambiguous_execs, unknown_scope_events, invalid_events, edges]
      properties:
        schema_version: {const: agentprovenance.runtime_correlation/v1}
        run_id: {type: string}
        method: {const: agentprov.command_time_process/v2}
        confidence: {type: number, const: 0.8, description: Attribution tier, not a calibrated probability.}
        status: {type: string, enum: [no_input, empty, ok, partial, ambiguous, failed]}
        input_complete: {type: boolean, description: Both bounded input scans completed; not a sensor completeness assertion.}
        observed_at: {type: string, format: date-time}
        tool_calls: {type: integer, minimum: 0}
        unclocked_calls: {type: integer, minimum: 0}
        runtime_events: {type: integer, minimum: 0}
        exec_events: {type: integer, minimum: 0}
        matched_execs: {type: integer, minimum: 0}
        inherited_execs: {type: integer, minimum: 0, description: Included in matched_execs.}
        ambiguous_execs: {type: integer, minimum: 0}
        unknown_scope_events: {type: integer, minimum: 0}
        invalid_events: {type: integer, minimum: 0}
        edges: {type: integer, minimum: 0, description: Published edges from this pass; zero if replacement rolled back.}
        issues: {type: array, items: {type: string}}
        ref: {type: string, description: Report object hash in launch JSON; absent from its own stored payload.}
      description: >
        Embedded in launch JSON and saved as a runtime_correlation object. Counts
        cover only eligible inputs read by this pass; they are partial observations
        when input_complete is false, not totals or estimated lost events. Derived
        command/time/process associations are distinct from kernel identity proof.
        No new HTTP route is implied. Transcript counters remain separate.
    EntryLinks:
      type: object
      required: [schema_version, run_id, entry_id, basis, links, has_more]
      properties:
        schema_version: {const: agentprovenance.agent_context/v1}
        run_id: {type: string}
        entry_id: {type: string}
        basis: {const: recorded_graph_edge}
        links:
          type: array
          maxItems: 200
          items:
            type: object
            required: [node_id, relation]
            properties:
              node_id: {type: string}
              relation: {type: string, enum: [context_tool_call, context_tool_result, context_notebook_request, context_notebook_caller, context_browser_operation, context_browser_caller]}
              basis: {const: source_asserted_native_identity}
              rule: {type: string, enum: [jupyter-mcp/v1, browser-mcp/v1]}
        has_more: {type: boolean}
        reason: {type: string, enum: [no_recorded_graph_link, prior_context_not_current_execution, notebook_request_unresolved, browser_operation_unresolved]}
      description: Existing graph destinations for this record, not a new execution or identity inference.
    SessionRef:
      type: object
      required: [harness, session_id, available]
      properties:
        run_id: {type: string}
        run_ids: {type: array, uniqueItems: true, items: {type: string}, description: Alternative recorded occurrences when the relationship identifies a native session but not one run. Choose an occurrence for navigation; this does not multiply the action.}
        harness: {type: string}
        session_id: {type: string}
        available: {type: boolean, description: At least one occurrence is available in the current store or exported catalog.}
      description: Native identity. An unavailable target retains its harness and session ID without guessing a run. A local same-run occurrence is preferred for navigation.
    SessionRelationEvidence:
      type: object
      required: [run_id, source_id, object_hash, basis]
      properties:
        run_id: {type: string}
        source_id: {type: string}
        object_hash: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        entry_id: {type: string}
        recorded_at: {type: string}
        basis: {type: string, enum: [same_harness_native_session_id, source_parent_session_id, native_spawn_result, native_fork_metadata, native_send_input_call]}
    SessionRelation:
      type: object
      required: [id, kind, from, to, evidence]
      properties:
        id: {type: string}
        kind: {type: string, enum: [same_session, parent, delegation, fork, message_request]}
        from: {$ref: '#/components/schemas/SessionRef'}
        to: {$ref: '#/components/schemas/SessionRef'}
        evidence: {type: array, minItems: 1, items: {$ref: '#/components/schemas/SessionRelationEvidence'}}
        issues: {type: array, items: {type: string, enum: [self_parent, parent_cycle, conflicting_parents]}}
      description: Parent, delegation and fork point from the source or parent to the child; message_request points from requester to target and does not assert delivery. same_session has no temporal direction. Prior-context actions and untyped prose are excluded.
    SessionRelationsPage:
      type: object
      required: [schema_version, subject, relations, has_more, limit, limited, issues]
      properties:
        schema_version: {const: agentprovenance.agent_context/v1}
        subject: {$ref: '#/components/schemas/SessionRef'}
        relations: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/SessionRelation'}}
        has_more: {type: boolean}
        next_cursor: {type: string, description: Opaque cursor bound to the evidence snapshot; restart on HTTP 400 after sources change.}
        limit: {type: integer, minimum: 1, maximum: 200}
        limited: {type: boolean, description: Discovery exceeded a source, action or body ceiling; separate from page continuation.}
        issues: {type: array, items: {type: string, enum: [session_source_discovery_limit, session_action_discovery_limit, session_relation_body_limit]}}
    SnapshotValue:
      type: object
      required: [present, truncated]
      properties:
        present: {type: boolean, description: False means absent in this record, not denied or revoked.}
        preview: {type: string, maxLength: 512, description: Bounded UTF-8 preview of the recorded redacted JSON value.}
        truncated: {type: boolean}
        sha256: {type: string, pattern: '^[a-f0-9]{64}$', description: Hash of the full JSON value before preview truncation.}
    SnapshotChange:
      type: object
      required: [path, before, after]
      properties:
        path: {type: string, description: JSON Pointer under content or status.}
        before: {$ref: '#/components/schemas/SnapshotValue'}
        after: {$ref: '#/components/schemas/SnapshotValue'}
    SnapshotComparison:
      type: object
      required: [schema_version, scope, status, left, right, changes, has_more]
      properties:
        schema_version: {const: agentprovenance.agent_context/v1}
        scope: {const: recorded_values}
        status: {type: string, enum: [same, different, unknown]}
        left: {$ref: '#/components/schemas/Entry'}
        right: {$ref: '#/components/schemas/Entry'}
        changes: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/SnapshotChange'}}
        has_more: {type: boolean, description: Additional differences omitted by the bounded comparison.}
        reason: {type: string, enum: [content_not_recorded, comparison_content_limit]}
      description: >
        Derived comparison of recorded values and source outcome status, never
        an effective-permissions decision. Source timestamps and content hashes
        remain available on both entries. Bodies over 1 MiB or not recorded
        yield unknown. Nested differences stop at depth 32; previews at 512
        bytes and changes at 200. Full evidence remains separately readable.
    Error:
      type: object
      required: [schema_version, error]
      properties:
        schema_version: {const: agentprovenance.agent_context/v1}
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string, enum: [invalid_argument, run_not_found, content_not_found, store_unavailable, evidence_read_failed]}
            message: {type: string}
  responses:
    InvalidArgument:
      description: Invalid run, cursor, page limit, or UTF-8 byte offset.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    NotFound:
      description: Run or run-scoped content reference does not exist.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    EvidenceFailure:
      description: Stored object could not be read or its hash did not verify.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    StoreUnavailable:
      description: Database unavailable; never reported as empty or missing evidence.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
paths:
  /api/compare/records:
    servers: [{url: 'http://127.0.0.1:7396'}]
    get:
      operationId: readComparisonRecords
      summary: Project saved evidence into whole-run comparison records
      security: []
      description: >
        Dashboard-only read-only projection of at most 50 saved sources per page.
        Configuration snapshots may contribute multiple fields. Rejects harness
        and session filters. Retained prior context is excluded. An empty page
        may have has_more=true; follow next_cursor. Values preserve JSON types
        and full digests with previews of at most 512 UTF-8 bytes. Configuration
        is bounded to 1 MiB and 200 fields per snapshot. Issues identify missing
        evidence or reached limits. Queries during capture are not frozen;
        refresh the comparison to include newly saved records.
      parameters:
        - {$ref: '#/components/parameters/run'}
        - {name: cursor, in: query, schema: {type: string, maxLength: 16384}}
      responses:
        '200': {description: Bounded comparison records with existing evidence references, content: {application/json: {schema: {$ref: '#/components/schemas/ComparisonPage'}}}}
        '400': {$ref: '#/components/responses/InvalidArgument'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/EvidenceFailure'}
  /api/search/sources:
    servers: [{url: 'http://127.0.0.1:7396'}]
    get:
      operationId: readSearchSources
      summary: List saved evidence readers for Dashboard keyword search
      security: []
      description: >
        Dashboard-only read-only catalog, at most 50 sources per page. Latest
        context revisions, exact saved artifact versions, tool records and
        runtime records are returned in successive catalog stages. A stage may
        return an empty page with has_more=true. The client follows next_cursor
        and scans /api/context/content or /api/artifact in bounded byte pages.
        No body is copied or indexed. Session scope requires both harness and
        session and uses only recorded direct relationships, without traversing
        shared paths or related sessions. Queries during capture are not a
        frozen snapshot; repeat a search to include newly saved records.
      parameters:
        - {$ref: '#/components/parameters/run'}
        - {name: harness, in: query, schema: {type: string, minLength: 1, maxLength: 128}}
        - {name: session, in: query, schema: {type: string, minLength: 1, maxLength: 512}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 16384}}
      responses:
        '200': {description: Bounded source catalog with reader references, content: {application/json: {schema: {$ref: '#/components/schemas/SearchSourcePage'}}}}
        '400': {$ref: '#/components/responses/InvalidArgument'}
        '404': {description: Selected native session does not occur in this run}
        '500': {$ref: '#/components/responses/EvidenceFailure'}
  /api/artifact:
    servers: [{url: 'http://127.0.0.1:7396'}]
    get:
      operationId: readSavedArtifactPage
      summary: Read a page of saved graph content from the local Dashboard
      security: []
      parameters:
        - {$ref: '#/components/parameters/run'}
        - {name: node, in: query, required: true, schema: {type: string, minLength: 1}}
        - {name: mode, in: query, schema: {type: string, enum: [body, raw], default: body}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: limit, in: query, schema: {type: integer, minimum: 4, maximum: 262144, default: 65536}}
        - {name: view_lang, in: query, schema: {type: string, examples: [en, zh-CN]}, description: Localizes generated headings only; keep fixed while paging.}
      responses:
        '200': {description: Saved text page or an explicit unavailable/ambiguous state, content: {application/json: {schema: {$ref: '#/components/schemas/ArtifactPage'}}}}
        '400': {description: 'Invalid required parameters, mode or UTF-8 page boundary'}
        '500': {description: Evidence index unavailable; not treated as missing content}
  /v1/context/overview:
    get:
      operationId: agent_context_overview
      summary: Source coverage and stored context counts
      parameters: [{$ref: '#/components/parameters/run'}]
      responses:
        '200': {description: Recorded coverage, content: {application/json: {schema: {$ref: '#/components/schemas/Overview'}}}}
        '400': {$ref: '#/components/responses/InvalidArgument'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/EvidenceFailure'}
        '503': {$ref: '#/components/responses/StoreUnavailable'}
  /v1/context/entries:
    get:
      operationId: agent_context_entries
      summary: Cursor-paged recorded context
      parameters:
        - {$ref: '#/components/parameters/run'}
        - {name: session, in: query, schema: {type: string}}
        - {name: harness, in: query, schema: {type: string}, description: Combine with session to keep native identities from different harnesses separate. Also intersects source and node filters.}
        - {name: source, in: query, schema: {type: string}}
        - {name: kind, in: query, schema: {type: string}}
        - {name: tool_call, in: query, schema: {type: string}}
        - {name: entry, in: query, schema: {type: string, maxLength: 512}, description: Exact record identity; use revisions=true for earlier versions.}
        - {name: node, in: query, schema: {type: string, maxLength: 512}, description: Exact stored context/tool/runtime graph relationships only; never command or PID guessing.}
        - {name: group, in: query, schema: {type: string, enum: [conversation, configuration]}}
        - {name: revisions, in: query, schema: {type: boolean, default: false}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 8192}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        '200': {description: Page with immutable evidence references, content: {application/json: {schema: {$ref: '#/components/schemas/EntryPage'}}}}
        '400': {$ref: '#/components/responses/InvalidArgument'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/EvidenceFailure'}
        '503': {$ref: '#/components/responses/StoreUnavailable'}
  /v1/context/session-relations:
    get:
      operationId: agent_context_session_relations
      summary: Read source-backed relationships for one native session
      description: >
        The requested session must occur in the requested run. Discovery uses at
        most 1024 latest same-harness source reports and 2048 typed action records;
        action bodies over 64 KiB are skipped with a limited diagnostic. Retained
        Entry.session_metadata supplies native fork facts without reading a
        configuration body, including under basic retention. Older entries use
        their retained body when available; unavailable metadata and body produce
        session_relation_metadata_unavailable rather than an inferred fork. The
        local endpoint queries the local store; static replay uses only its
        exported catalog. Relationships neither change run membership nor
        widen query or export scope.
      parameters:
        - {$ref: '#/components/parameters/run'}
        - {name: harness, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
        - {name: session, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 512}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 8192}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        '200': {description: Evidence-backed relationships and explicit discovery limits, content: {application/json: {schema: {$ref: '#/components/schemas/SessionRelationsPage'}}}}
        '400': {$ref: '#/components/responses/InvalidArgument'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/EvidenceFailure'}
        '503': {$ref: '#/components/responses/StoreUnavailable'}
  /v1/context/content:
    get:
      operationId: agent_context_content
      summary: Read verified stored text without the source machine
      parameters:
        - {$ref: '#/components/parameters/run'}
        - {name: ref, in: query, required: true, schema: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}, description: Redacted UTF-8 byte offset; use returned next_offset.}
        - {name: limit, in: query, schema: {type: integer, minimum: 4, maximum: 262144, default: 65536}}
      responses:
        '200': {description: Hash-checked content page, content: {application/json: {schema: {$ref: '#/components/schemas/ContentPage'}}}}
        '400': {$ref: '#/components/responses/InvalidArgument'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/EvidenceFailure'}
        '503': {$ref: '#/components/responses/StoreUnavailable'}
  /v1/context/attachment:
    get:
      operationId: agent_context_attachment
      summary: Read a hash-checked page of a retained raster attachment
      parameters:
        - {$ref: '#/components/parameters/run'}
        - {name: ref, in: query, required: true, schema: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}, description: Decoded image byte offset.}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 262144, default: 65536}}
      responses:
        '200': {description: JSON page containing base64 image bytes, content: {application/json: {schema: {$ref: '#/components/schemas/AttachmentPage'}}}}
        '400': {$ref: '#/components/responses/InvalidArgument'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/EvidenceFailure'}
        '503': {$ref: '#/components/responses/StoreUnavailable'}
  /v1/context/links:
    get:
      operationId: agent_context_links
      summary: Existing graph destinations for one recorded context entry
      parameters:
        - {$ref: '#/components/parameters/run'}
        - {name: entry, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 512}}
      responses:
        '200': {description: Recorded links or an explicit missing-link reason, content: {application/json: {schema: {$ref: '#/components/schemas/EntryLinks'}}}}
        '400': {$ref: '#/components/responses/InvalidArgument'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/EvidenceFailure'}
        '503': {$ref: '#/components/responses/StoreUnavailable'}
  /v1/context/compare:
    get:
      operationId: agent_context_compare
      summary: Compare two recorded task, configuration, or approval snapshots
      parameters:
        - {$ref: '#/components/parameters/run'}
        - {name: left, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 512}}
        - {name: right, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 512}}
        - {name: right_run, in: query, schema: {type: string, minLength: 1, maxLength: 512}, description: Defaults to run; cross-run comparison must be explicit.}
      responses:
        '200': {description: Bounded comparison with immutable source references, content: {application/json: {schema: {$ref: '#/components/schemas/SnapshotComparison'}}}}
        '400': {$ref: '#/components/responses/InvalidArgument'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/EvidenceFailure'}
        '503': {$ref: '#/components/responses/StoreUnavailable'}
