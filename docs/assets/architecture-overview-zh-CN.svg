<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720" role="img" aria-labelledby="title desc" lang="zh-CN">
  <title id="title">AgentProvenance 架构总览</title>
  <desc id="desc">数据通过 API 和接收入口，进入观测、因果关联、溯源、证据查询和风险分析模块。</desc>
  <style>
    .bg { fill: #f8fafc; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 14; }
    .core { fill: #eef6ff; stroke: #60a5fa; stroke-width: 2; rx: 14; }
    .risk { fill: #fff7ed; stroke: #fb923c; stroke-width: 2; rx: 14; }
    .query { fill: #f0fdf4; stroke: #4ade80; stroke-width: 2; rx: 14; }
    .txt { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #0f172a; }
    .title { font-size: 30px; font-weight: 800; }
    .subtitle { font-size: 16px; fill: #475569; }
    .label { font-size: 17px; font-weight: 700; }
    .small { font-size: 13px; fill: #475569; }
    .tiny { font-size: 12px; fill: #64748b; }
    .arrow { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .dash { stroke-dasharray: 6 6; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1180" height="720" />
  <text class="txt title" x="50" y="58"><tspan style="fill:#0071e3">Agent</tspan>Provenance</text>
  <text class="txt subtitle" x="50" y="86">记录 Agent 的执行过程，提供 Git 式溯源</text>

  <rect class="panel" x="50" y="130" width="210" height="390" />
  <text class="txt label" x="75" y="164">数据生产者</text>
  <text class="txt small" x="75" y="202">Agent 运行框架</text>
  <text class="txt small" x="75" y="232">免 SDK 记录器</text>
  <text class="txt small" x="75" y="262">Python 辅助库</text>
  <text class="txt small" x="75" y="292">Falco / Tetragon</text>
  <text class="txt small" x="75" y="322">auditd / eBPF 传感器</text>
  <text class="txt small" x="75" y="352">Docker / 沙箱标识</text>
  <text class="txt tiny" x="75" y="407">应用上下文</text>
  <text class="txt tiny" x="75" y="430">系统遥测</text>
  <text class="txt tiny" x="75" y="453">评估信号</text>

  <rect class="panel" x="330" y="130" width="230" height="390" />
  <text class="txt label" x="360" y="164">API / 接收入口</text>
  <text class="txt small" x="360" y="205">格式校验</text>
  <text class="txt small" x="360" y="235">标识标准化</text>
  <text class="txt small" x="360" y="265">敏感信息脱敏</text>
  <text class="txt small" x="360" y="295">磁盘缓冲 / 背压</text>
  <text class="txt small" x="360" y="325">数据保留策略</text>
  <text class="txt tiny" x="360" y="390">生产者通过接收入口</text>
  <text class="txt tiny" x="360" y="413">写入核心图。</text>

  <rect class="core" x="630" y="110" width="250" height="450" />
  <text class="txt label" x="660" y="145">观测核心</text>
  <text class="txt small" x="660" y="187">工具调用范围绑定</text>
  <text class="txt small" x="660" y="217">执行时间线</text>
  <text class="txt small" x="660" y="247">运行时因果图</text>
  <text class="txt small" x="660" y="277">进程 / 文件 / 网络</text>
  <text class="txt small" x="660" y="307">差异比较 / 来源追溯</text>
  <text class="txt small" x="660" y="337">产物谱系</text>
  <text class="txt small" x="660" y="367">回放清单</text>
  <text class="txt tiny" x="660" y="430">关联应用上下文</text>
  <text class="txt tiny" x="660" y="453">与运行时事实。</text>

  <rect class="query" x="940" y="130" width="190" height="170" />
  <text class="txt label" x="965" y="164">查询入口</text>
  <text class="txt small" x="965" y="204">观测摘要</text>
  <text class="txt small" x="965" y="232">执行时间线</text>
  <text class="txt small" x="965" y="260">解释 / 校验</text>

  <rect class="risk" x="940" y="350" width="190" height="170" />
  <text class="txt label" x="965" y="384">风险与审计</text>
  <text class="txt small" x="965" y="424">行为基线</text>
  <text class="txt small" x="965" y="452">策略 / 污点传播</text>
  <text class="txt small" x="965" y="480">取证包</text>

  <path class="arrow" d="M260 325 L330 325" />
  <path class="arrow" d="M560 325 L630 325" />
  <path class="arrow" d="M880 235 L940 215" />
  <path class="arrow" d="M880 405 L940 435" />
  <path class="arrow dash" d="M1035 350 L1035 305" />

  <rect class="panel" x="330" y="585" width="800" height="80" />
  <text class="txt label" x="360" y="620">证据完整性</text>
  <text class="txt small" x="360" y="648">v1 提供本地完整性校验与签名证据；采集时的主机外存证列入后续计划。</text>
</svg>
